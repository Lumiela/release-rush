<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리즈 러시</title>
<style>
html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:#e8ebff;user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;background:#0b0f1e;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.panel{background:rgba(11,15,30,.94);border:.25em solid #3a4378;border-radius:.6em;padding:1.6em 2em;box-shadow:0 0 0 .25em #0b0f1e}
h2{margin:0 0 .3em;font-size:2.4em;letter-spacing:-.02em}
.sub{color:#9aa2c7;font-size:1.3em}
.key{display:inline-block;background:#2d3561;border-radius:.3em;padding:0 .45em;font-weight:700;color:#ffd84a}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
/* idle */
.idle{position:absolute;inset:0;display:grid;grid-template-columns:1.15fr 1fr;gap:3em;align-items:center;padding:0 5em}
.logo{text-shadow:.08em .08em 0 #000,0 0 .6em #05060c}
.logo .t1{font-size:5.2em;font-weight:900;letter-spacing:.02em;line-height:1;color:#3ef2ff;text-shadow:.08em .08em 0 #ff4fd8}
.logo .t2{font-size:2.6em;font-weight:900;margin-top:.3em}
.logo .t3{font-size:1.5em;color:#ffd84a;margin-top:.4em}
.logo .start{font-size:1.7em;margin-top:2.2em;font-weight:700}
.logo .howto{font-size:1.15em;color:#9aa2c7;margin-top:1em;line-height:1.7}
.rank h3{margin:0 0 .5em;font-size:1.8em;color:#ffd84a}
table.rk{width:100%;border-collapse:collapse;font-size:1.25em}
table.rk td{padding:.3em .4em;border-bottom:.08em solid #262d55;white-space:nowrap}
table.rk td.n{color:#9aa2c7;width:2em}
table.rk td.s{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.rk td.b{text-align:right;color:#7be3a0;font-size:.8em;width:4.5em}
table.rk tr.me td{background:rgba(62,242,255,.15);color:#3ef2ff}
table.rk tr.top1 td.n{color:#ffd84a}
.empty{color:#9aa2c7;font-size:1.2em;padding:1em 0}
.warn{color:#ff8a5c;font-size:1.1em;margin-top:.8em}
/* nickname */
.nick input{font:inherit;font-size:2.2em;width:9em;padding:.25em .5em;border-radius:.3em;border:.12em solid #3ef2ff;background:#141933;color:#fff;outline:none;margin:.6em 0 .3em}
.nick .err{color:#ff8a5c;font-size:1.2em;min-height:1.5em}
.btn{font:inherit;font-size:1.5em;font-weight:700;background:#3ef2ff;color:#0b0f1e;border:none;border-radius:.4em;padding:.4em 1.2em;cursor:pointer}
.btn.ghost{background:#2d3561;color:#e8ebff}
/* cards */
.picktitle{font-size:2.2em;font-weight:900;margin-bottom:.2em;text-shadow:.06em .06em 0 #000}
.cards{display:flex;gap:1.6em;margin-top:1.4em}
.cardc{width:15em;min-height:17em;background:#141933;border:.25em solid #3a4378;border-radius:.6em;padding:1.2em;cursor:pointer;position:relative;transition:transform .08s}
.cardc:hover,.cardc.sel{border-color:#3ef2ff;transform:translateY(-.4em)}
.cardc .no{position:absolute;top:.6em;right:.8em;font-size:1.3em;font-weight:900;color:#ffd84a}
.cardc .tg{display:inline-block;font-size:1em;background:#2d3561;border-radius:.3em;padding:.05em .5em;color:#9aa2c7}
.cardc .nm{font-size:1.9em;font-weight:900;margin:.5em 0 .4em}
.cardc .bg{font-size:1.55em;font-weight:900;color:#ffd84a;margin:.1em 0 .45em;line-height:1.3}
.cardc .ds{font-size:1.15em;color:#c8cff0;line-height:1.5}
.build{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em .9em;margin-top:1.2em;max-width:62em;font-size:1.15em;background:rgba(11,15,30,.85);border:.15em solid #3a4378;border-radius:.5em;padding:.5em 1em}
.build i{font-style:normal;color:#9aa2c7}
.build b{color:#7be3a0}
.cardc .own{font-size:1.05em;color:#7be3a0;margin-top:.8em}
.lineup{font-size:1.2em;color:#c8cff0;margin-top:.4em;text-shadow:.06em .06em 0 #000}
.lineup b{color:#ffd84a}
.lineup b.cur{color:#3ef2ff}
.cd{margin-top:1.4em;font-size:1.2em;color:#9aa2c7;text-shadow:.06em .06em 0 #000}
/* route */
.routes{display:flex;gap:2em;margin-top:1.4em}
.rt{width:24em;background:#141933;border:.3em solid #3a4378;border-radius:.6em;padding:1.4em 1.6em;cursor:pointer}
.rt.safe.sel,.rt.safe:hover{border-color:#5ccfae}
.rt.risk.sel,.rt.risk:hover{border-color:#ff8a5c}
.rt .lb{font-size:1.1em;font-weight:700}
.rt.safe .lb{color:#5ccfae}.rt.risk .lb{color:#ff8a5c}
.rt .nm{font-size:2.2em;font-weight:900;margin:.2em 0 .5em}
.rt ul{margin:0;padding-left:1.2em;font-size:1.3em;line-height:1.7;color:#c8cff0}
/* roulette */
.rl{text-align:center;min-width:30em}
.rl .ch{font-size:1.4em;color:#9aa2c7}
.rl .spin{font-size:3em;font-weight:900;margin:.5em 0;min-height:1.3em}
.rl .res{font-size:1.4em;min-height:3em;line-height:1.6}
.rl.win .spin{color:#ffd84a}
.rl.lose .spin{color:#9aa2c7}
/* result */
.res2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44em;background:rgba(11,15,30,.95);border:.3em solid #3ef2ff;border-radius:.8em;padding:1.1em 2.2em 1.2em;text-align:center;box-shadow:0 0 0 .3em #0b0f1e,0 0 2.5em rgba(62,242,255,.25)}
.res2.fail{border-color:#ff8a5c;box-shadow:0 0 0 .3em #0b0f1e,0 0 2.5em rgba(255,138,92,.25)}
.res2 .rhead{font-size:1.5em;font-weight:900;letter-spacing:.35em;color:#3ef2ff}
.res2.fail .rhead{color:#ff8a5c}
.res2 .rtop{display:flex;align-items:center;justify-content:center;gap:1.4em;margin:.6em 0 .3em}
.res2 .grade{width:1.6em;height:1.6em;line-height:1.5em;font-size:5em;font-weight:900;border:.08em solid currentColor;border-radius:.18em;text-shadow:.05em .05em 0 #000;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) .5s both}
@keyframes stamp{from{transform:scale(2.6) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.res2 .rsc{text-align:left}
.res2 .rlabel{font-size:1.2em;color:#9aa2c7}
.res2 .rnum{font-size:4.6em;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff}
.res2 .rbadge{display:inline-block;background:#ff4fd8;color:#fff;font-weight:900;padding:.1em .6em;border-radius:.3em;font-size:1.15em;margin-top:.2em;letter-spacing:.05em}
.res2 .rbadge.dim{background:#2d3561;color:#c8cff0;letter-spacing:0}
.res2 .rbadge.demo{background:#ff4fd8}
.res2 .rbadge.top{background:#3ef2ff;color:#0b0f1e}
.res2 .rhon{font-size:2.1em;font-weight:900;color:#ffd84a;margin-top:.35em}
.res2 .rmsg{font-size:1.25em;color:#c8cff0;margin-top:.1em}
.res2 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em;margin:1em 0 .8em}
.res2 .tile{background:#141933;border:.1em solid #2d3561;border-radius:.5em;padding:.45em .3em .5em}
.res2 .tile i{display:block;font-style:normal;font-size:1.05em;color:#9aa2c7}
.res2 .tile b{display:block;font-size:1.9em;font-weight:900;color:#fff;margin-top:.1em}
.res2 .tile small{font-size:.5em;color:#9aa2c7;margin-left:.2em}
table.mrk{width:70%;margin:0 auto;border-collapse:collapse;font-size:1.2em}
table.mrk td{padding:.18em .5em;border-bottom:.08em solid #1e2547;text-align:left}
table.mrk td.n{width:2em;color:#9aa2c7;font-weight:900}
table.mrk td.s{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
table.mrk tr:first-child td{color:#ffd84a}
table.mrk tr.me td{background:rgba(62,242,255,.16);color:#3ef2ff}
table.mrk tr.gap td{text-align:center;color:#9aa2c7;border-bottom:none;padding:0}
.res2 .ract{margin-top:.9em;font-size:1.3em;color:#9aa2c7}
#demoBadge{position:absolute;right:1.2%;top:11%;display:none;pointer-events:none;background:rgba(255,79,216,.92);color:#fff;font-weight:900;padding:.35em .9em;border-radius:.3em;font-size:calc(min(100vw,177.78vh)/100*1.3);letter-spacing:.04em;z-index:5}
#demoBadge span{animation:blink 1s steps(2,start) infinite}
#toast{position:absolute;right:1.2%;top:1.2%;display:none;z-index:6;pointer-events:none;background:rgba(11,15,30,.95);border:.2em solid #3a4378;border-radius:.5em;padding:.45em 1.2em;font-size:calc(min(100vw,177.78vh)/100*1.35);font-weight:700;color:#fff;white-space:nowrap}
/* items · shop */
.cardc.item .tg.tier{color:#0b0f1e;font-weight:700}
.cardc.t-common .tg.tier{background:#c8cff0}
.cardc.t-rare{border-color:#5aa8ff}.cardc.t-rare .tg.tier{background:#5aa8ff}
.cardc.t-legend{border-color:#ffd84a;box-shadow:0 0 1em rgba(255,216,74,.45)}.cardc.t-legend .tg.tier{background:#ffd84a}
.cardc.item.sel,.cardc.face.sel{border-color:#3ef2ff;transform:translateY(-.4em)}
.cardc.dim{opacity:.45}
.cardc.face{display:flex;align-items:center;justify-content:center}
.cardc.face .q{font-size:7em;font-weight:900;color:#3a4378}
.price{font-size:1.45em;font-weight:900;color:#7be3a0;margin-top:.3em}
.price.poor{color:#ff8a8a}
.actions{display:flex;gap:1em;margin-top:1.1em}
.actions .btn{font-size:1.15em;padding:.35em .9em}
.evlast{min-height:1.5em;margin-top:.7em;font-size:1.3em;font-weight:700;text-shadow:.06em .06em 0 #000}
.odds{font-size:1.15em;color:#c8cff0;margin-top:.3em;text-shadow:.06em .06em 0 #000}
/* stage ready (rule card) */
.ready{position:absolute;left:50%;top:10.5%;transform:translateX(-50%);width:66%;background:rgba(11,15,30,.96);border:.3em solid #3ef2ff;border-radius:.7em;padding:1em 1.6em 1.1em;text-align:center;box-shadow:0 0 0 .3em #0b0f1e,0 0 2em rgba(62,242,255,.25)}
.ready.warn{border-color:#ff3b3b;box-shadow:0 0 0 .3em #0b0f1e,0 0 2em rgba(255,59,59,.35)}
.ready.boss{border-color:#ff8a8a}
.ready .rtag{font-size:1.25em;color:#9aa2c7;font-weight:700}
.ready.warn .rtag{color:#ff5a5a}
.ready .rtitle{font-size:3em;font-weight:900;margin:.05em 0 .25em;color:#fff;line-height:1.2}
.ready.boss .rtitle{font-size:2.3em;color:#ff8a8a}
.ready .rkeys{font-size:.5em;vertical-align:middle;margin-left:.4em}
.kbig{display:inline-block;min-width:2em;padding:.12em .55em;margin:0 .15em;border-radius:.35em;background:#e8ebff;color:#0b0f1e;font-weight:900;font-size:1.25em;box-shadow:0 .18em 0 #9aa2c7;line-height:1.3}
.ready ul{list-style:none;margin:.2em auto .3em;padding:0;text-align:left;display:inline-block;font-size:1.45em;line-height:1.85}
.ready ul b{display:inline-block;min-width:5.6em;color:#ffd84a}
.ready ul b.p{color:#ffd84a}.ready ul b.m{color:#ff8a8a}.ready ul b.t{color:#9ad8ff}
.ready ul.rlist b{min-width:7em}
.ready ul.rlist .kbig{font-size:.8em}
.ready em{font-style:normal;color:#ffd84a;font-weight:700}
.ready em.g{color:#3ccf6e}.ready em.r{color:#ff6b6b}.ready em.y{color:#ffd84a}
.ready .rgoal{font-size:1.3em;font-weight:700;margin:.25em auto .15em;padding:.3em .8em;background:#141933;border-radius:.4em;display:inline-block;color:#e8ebff}
.ready .rgoal b{display:inline-block;padding:0 .45em;margin:0 .4em 0 .9em;border-radius:.25em;color:#0b0f1e;font-weight:900}
.ready .rgoal b:first-child{margin-left:0}
.ready .rgoal b.g{background:#7be3a0}.ready .rgoal b.r{background:#ff6b6b}.ready .rgoal b.y{background:#ffd84a}
.ending{position:absolute;inset:0;display:flex;flex-direction:column;padding:2em 7em 1.4em}
.ending .etop{text-align:center;text-shadow:.08em .08em 0 #000}
.ending .ettl{font-size:2.7em;font-weight:900;color:#7be3a0;letter-spacing:.01em}
.ending.fail .ettl{color:#ff8a5c}
.ending .esub{font-size:1.2em;color:#9aa2c7;margin-top:.15em}
.elist{flex:1;min-height:0;overflow-y:auto;margin-top:.8em;background:rgba(11,15,30,.9);border:.15em solid #3a4378;border-radius:.6em;padding:.3em 1.2em;font-size:1.06em;scrollbar-width:thin;scrollbar-color:#3a4378 transparent}
.erow{display:grid;grid-template-columns:8.6em 1fr auto;gap:.8em;align-items:baseline;padding:.17em 0;border-bottom:.08em solid #1e2547;animation:rowIn .35s ease-out both}
.erow .et{font-weight:900;white-space:nowrap}
.erow .ex{color:#e8ebff;font-weight:700}
.erow .ex i{font-style:normal;font-weight:400;color:#9aa2c7;font-size:.9em;margin-left:.6em}
.erow .ep{font-weight:900;color:#ffd84a;font-variant-numeric:tabular-nums}
.erow.sum{border-bottom:none;border-top:.12em solid #3a4378;margin-top:.2em}
@keyframes rowIn{from{opacity:0;transform:translateX(-1.5em)}to{opacity:1;transform:none}}
.efoot{text-align:center;margin-top:.7em;font-size:1.4em;color:#9aa2c7;text-shadow:.06em .06em 0 #000;min-height:2.3em}
.efoot b{font-size:1.9em;color:#fff;font-weight:900;vertical-align:middle;margin:0 .3em;font-variant-numeric:tabular-nums}
.ready .rmeta{font-size:1.2em;color:#c8cff0;margin-top:.2em}
.ready .rgo{font-size:1.6em;font-weight:900;margin-top:.55em;color:#3ef2ff;animation:pulse 1.2s ease-in-out infinite}
.ready .rgo .kbig{font-size:1em}
.ready .rsub{font-size:.6em;color:#9aa2c7;font-weight:400}
@keyframes pulse{50%{opacity:.55}}
.pause{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;flex-direction:column}
.pause b{font-size:3em}
.pause span{font-size:1.4em;color:#9aa2c7;margin-top:.5em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui"></div>
  <div id="demoBadge">DEMO PLAY · <span>아무 키나 누르면 시작</span></div>
  <div id="toast"></div>
</div>
<script>
(function(){
'use strict';

// ---------- 기본 설정 ----------
var W = 320, H = 180, S = 4;
var TOTAL_TIME = 55;
var MISS_TIME = 2;   // 미스 1회당 제한 시간 감소(초). 추정치
var CHOICE_TIME = 10;     // (사용 안 함) 카드·루트 선택은 시간 제한 없음
var IDLE_ABANDON = 180;   // 선택 화면에서 입력 없이 이 시간(초)이 지나면 처음 화면으로 (부스 안전장치)
var lastInputAt = performance.now();
var STORE_KEY = 'releaseRush.records.v1';
var NAME_KEY = 'releaseRush.lastName.v1';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
cv.width = W * S; cv.height = H * S;
var ui = document.getElementById('ui');
var stage = document.getElementById('stage');

function fit(){ var r = stage.getBoundingClientRect(); ui.style.fontSize = (r.width / 100) + 'px'; }
window.addEventListener('resize', fit); fit();

// 테스트용 시드 (?seed=123). 기본은 Math.random
var seedMatch = /[?&]seed=(\d+)/.exec(location.search);
var rand = Math.random;
if (seedMatch) {
  var sd = parseInt(seedMatch[1], 10) >>> 0;
  rand = function(){ sd |= 0; sd = sd + 0x6D2B79F5 | 0; var t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function ri(n){ return Math.floor(rand() * n); }
function pick(arr){ return arr[ri(arr.length)]; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = ri(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

// ---------- 게임 데이터 ----------
var OPP = [2, 3, 0, 1]; // 위 오른 아래 왼
var KEYMAP = { ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3 };
var DIR_CODE = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'];

// 미니게임 풀: 판마다 4개 중 3개를 골라 1·2·3층에 무작위 배정 (스테이지 수보다 많게)
var MG_LIST = ['timing', 'command', 'alert', 'sort'];
var MG_INFO = {
  timing:  { name:'배포 타이밍',    how:'커서가 초록 구간에 오면 Space',        short:'초록 구간에서 Space!' },
  command: { name:'커맨드 입력',    how:'화살표 순서대로 방향키',              short:'화살표 순서대로!' },
  alert:   { name:'장애 알림',      how:'빨간불이 초록불로 바뀌는 순간 Space',   short:'초록불에 Space!' },
  sort:    { name:'코드 리뷰 분류', how:'버그면 ←(반려), 정상이면 →(승인)',     short:'버그 ← / 정상 →' }
};
// 스테이지 시작 전 룰 카드에 보여 줄 설명
var MG_RULES = {
  timing:  { keys:['Space'],           doing:'커서가 <em>초록 구간</em>에 들어왔을 때 Space', perfect:'가운데 <em>노란 부분</em>에서 누르기',  miss:'초록 구간 밖에서 누르기',            tip:'연속으로 성공할수록 초록 구간이 좁아져요' },
  command: { keys:['↑', '↓', '←', '→'], doing:'화살표를 <em>순서대로</em> 방향키로 입력',    perfect:'커맨드를 한 번도 안 틀리고 완성',      miss:'틀린 방향 → 그 커맨드 처음부터',    tip:'<em class="r">빨간 화살표</em>는 반대 방향, <em>?</em>는 차례가 되면 공개' },
  alert:   { keys:['Space'],           doing:'신호가 <em class="g">초록불</em>로 바뀌는 순간 Space', perfect:'초록불이 켜지자마자 누르기',  miss:'빨강·노랑일 때 누르기, 초록불 놓치기', tip:'<em class="y">노란불</em>은 함정! 기다리세요' },
  sort:    { keys:['←', '→'],          doing:'<em class="r">버그</em> 카드면 ←(반려), <em class="g">정상</em> 카드면 →(승인)', perfect:'카드가 나오자마자 맞히기', miss:'잘못 분류, 시간 초과', tip:'빨간 벌레 = 버그, 초록 체크 = 정상' }
};
// 난이도: safe·risk는 층별 [1층, 2층, 3층], warn은 WARNING 중간보스, boss는 최종 보스
var MG_DIFF = {

var storageOK = true;
var memRecords = [];
function loadRecords(){
  try {
    var s = localStorage.getItem(STORE_KEY);
    var arr = s ? JSON.parse(s) : [];
    return Array.isArray(arr) ? arr.filter(function(r){ return r && typeof r.name === 'string' && typeof r.score === 'number'; }) : [];
  } catch (e) { storageOK = false; return memRecords.slice(); }
}
function saveRecord(rec){
  var list = loadRecords(); list.push(rec);
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
    var back = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    storageOK = Array.isArray(back) && back.length === list.length;
  } catch (e) { storageOK = false; memRecords = list; }
}
function clearRecords(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} memRecords = []; }
function bestList(){
  var best = {};
  loadRecords().forEach(function(r){
    var b = best[r.name];
    if (!b || r.score > b.score || (r.score === b.score && r.t < b.t)) best[r.name] = r;
  });
  return Object.keys(best).map(function(k){ return best[k]; })
    .sort(function(a, b){ return b.score - a.score || a.t - b.t; });
}

function diffOf(mg, tier, L){ var d = MG_DIFF[mg][tier]; return Array.isArray(d) ? d[Math.max(0, Math.min(2, L))] : d; }
function newTask(mg, tier, L){
  var d = diffOf(mg, tier, L), easy = has('shortcut') ? 1.3 : 1;
  var names = CMD_NAMES[tier === 'boss' ? 3 : Math.max(0, Math.min(2, L))];
  var t = { mg:mg, tier:tier, d:d, miss:0, name:pick(names) };
  if (mg === 'timing') {
    t.speed = d.speed * Math.max(0.6, 1 - 0.15 * cnt('autocomplete'));
    t.zoneW = Math.min(0.5, d.zone * easy); t.move = d.move; t.phase = rand() * Math.PI * 2;
    t.cur = G.lastCur || 0; t.dir = G.lastDir || 1; t.lock = 0;
    t.zoneVis = zoneTarget(t); placeZone(t);
  } else if (mg === 'command') {
    var len = Math.max(3, d.len - (has('shortcut') ? 1 : 0));
    t.arrows = [];
    for (var j = 0; j < len; j++) {
      var r = rand(), type = 'n';
      if (r < d.rev) type = 'rev'; else if (r < d.rev + d.hid) type = 'hid';
      if (type === 'rev' && has('review')) type = 'n';
      if (type === 'hid' && has('docs')) type = 'n';
      t.arrows.push({ dir:ri(4), type:type });
    }
    t.progress = Math.min(cnt('autocomplete'), t.arrows.length - 1);
  } else if (mg === 'alert') {
    t.win = d.win * easy; t.fake = d.fake; alertReset(t);
  } else if (mg === 'sort') {
    t.time = d.time * easy; sortNext(t);
  }
  return t;
}

}
// 입력 → 현재 미니게임 판정. 'perfect' / 'good'이면 작업 하나 처리
function taskInput(code){
  if (!taskReady()) return null;
  var res = MGX[G.task.mg].input(G.task, code);
  if (res === 'perfect' || res === 'good') taskSuccess(res);
  return res;
}
function taskSuccess(res){
  var t = G.task;
  var base = G.isMid ? MID.per : TASK.base * (G.isBoss ? 1 : routeMult(G.routeKey));
  var pts = Math.round(base * (res === 'perfect' ? perfectMult() : 1) * workMult(G.combo + (t.mg === 'command' ? 0 : 1)) * (G.isMid ? 1 : G.layerMult));
  G.score += pts; G.layerPoints += pts;
  G.coins += G.isMid ? COIN.mid : (res === 'perfect' ? COIN.perfect : COIN.good);
  if (t.mg !== 'command') { G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo; }
  if (res === 'perfect') G.perfects++;
  fx.pops.push({ x:200, y:62, text:(res === 'perfect' ? 'PERFECT +' : 'GOOD +') + pts, color:res === 'perfect' ? '#ffd84a' : '#7be3a0', t:0.8 });
  addFever(t.mg === 'command' ? FEVER.perCmd : ((res === 'perfect' ? FEVER.perfect : FEVER.good) + Math.min(G.combo, 20) * FEVER.comboBonus));
  if (t.mg === 'timing') { G.lastCur = t.cur; G.lastDir = t.dir; }
  if (G.isMid) {   // 중간보스: 제한 시간 안에 최대한 많이. 작업이 끝없이 이어짐
    G.midHits++; G.midGain += pts;
    battleHit(res === 'perfect' ? 2 : 1, false);
    G.task = newTask(G.midMg, 'warn', G.midL);
    return;
  }
  G.idx++;
  var last = G.idx >= G.queue.length;
  battleHit(G.isBoss ? 3 : (res === 'perfect' ? 2 : 1), !G.isBoss, last);
  if (last) { layerClear(); return; }
  G.task = newTask(G.queue[G.idx], G.isBoss ? 'boss' : G.routeKey, G.layer);
  if (G.isBoss && G.task.mg !== t.mg) showMsg('패턴 전환! ' + MG_INFO[G.task.mg].name + ' — ' + MG_INFO[G.task.mg].short, '#ffd84a', 1.2);
}
function taskMiss(reason){
  fx.pops.push({ x:110, y:72, text:reason || 'MISS', color:'#ff5a5a', t:0.7 });
  if (G.linterLeft > 0) { G.linterLeft--; showMsg('린터가 미스를 막았다!', '#ffd84a', 0.9); return false; }
  if (G.shield > 0) { G.shield--; showMsg('보험 아이템이 미스를 막았다! (남은 ' + G.shield + '회)', '#7be3a0', 0.9); return false; }
  battleMiss();
  if (!G.isMid && MISS_TIME > 0) {   // 미스 = 제한 시간 감소 (WARNING은 본 게임 시간이 멈춰 있으므로 제외)
    G.time -= MISS_TIME; G.missTime += MISS_TIME; G.timeHit = 0.5;
    fx.pops.push({ x:160, y:30, text:'−' + MISS_TIME + '초', color:'#ff5a5a', t:0.8 });
  }
  G.combo = 0; G.fever = Math.max(0, G.fever - FEVER.mistake);
  G.mistakes++; G.layerMistakes++; if (G.task) G.task.miss++;
  fx.shake = 0.25; fx.flash = 0.5; fx.flashColor = '#ff3b3b';
  return true;
}

// ---------- 미니게임 ① 배포 타이밍: 커서가 초록 구간에 오면 Space ----------
function widthFactor(){ return Math.max(TIMING.widthMin, TIMING.widthStart - TIMING.widthStep * G.combo); }
function zoneTarget(t){ return Math.min(TIMING.widthMax, t.zoneW * widthFactor()); }
function zoneWidth(t){ return t.zoneVis; }
function placeZone(t){ var half = zoneTarget(t) / 2, m = 0.04; t.zoneBase = half + m + rand() * Math.max(0, 1 - 2 * (half + m)); }
function zoneCenter(t){
  var half = zoneWidth(t) / 2;
  var c = t.move ? t.zoneBase + Math.sin(t.phase) * 0.18 : t.zoneBase;
  return Math.max(half + 0.02, Math.min(1 - half - 0.02, c));
}
// ---------- 미니게임 ③ 장애 알림: 빨간불 → 초록불 순간 Space, 노란불은 함정 ----------
function alertReset(t){
  t.state = 'wait'; t.el = 0; t.wait = 0.6 + rand() * 1.0; t.goT = 0; t.fakeT = 0;
  t.fakeAt = rand() < t.fake ? t.wait * (0.3 + rand() * 0.4) : -1;
}
// ---------- 미니게임 ④ 코드 리뷰 분류: 버그면 ←, 정상이면 → ----------
function sortNext(t){ t.card = rand() < 0.5 ? 'bug' : 'ok'; t.el = 0; }

function isTapKey(code){ return code === 'Space' || code === 'Enter' || code === 'NumpadEnter'; }
var MGX = {
  timing: {
    update:function(t, dt){
      t.cur += t.dir * t.speed * dt;
      if (t.cur >= 1) { t.cur = 2 - t.cur; t.dir = -1; } else if (t.cur <= 0) { t.cur = -t.cur; t.dir = 1; }
      if (t.move) t.phase += dt * t.move * Math.PI * 2;
      t.zoneVis += (zoneTarget(t) - t.zoneVis) * Math.min(1, dt * 8);
      if (t.lock > 0) t.lock -= dt;
    },
    input:function(t, code){
      if (!isTapKey(code) || t.lock > 0) return null;
      t.lock = TIMING.lock;
      var d = Math.abs(t.cur - zoneCenter(t)), half = zoneWidth(t) / 2, tol = has('pair') ? TIMING.pairTol : 0;
      var res = d <= half * TIMING.perfectRatio ? 'perfect' : (d <= half + tol ? 'good' : 'miss');
      G.lastHitMark = { res:res, x:t.cur, t:0.45 };
      if (res === 'miss') { taskMiss(); return 'miss'; }
      return res;
    }
  },
  command: {
    update:function(){},
    input:function(t, code){
      if (!KEYMAP.hasOwnProperty(code)) return null;
      var a = t.arrows[t.progress], expect = a.type === 'rev' ? OPP[a.dir] : a.dir;
      if (KEYMAP[code] !== expect) {
        taskMiss();
        if (!has('pair')) t.progress = Math.min(cnt('autocomplete'), t.arrows.length - 1);
        return 'miss';
      }
      t.progress++;
      G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
      addFever(FEVER.perArrow + Math.min(G.combo, 20) * FEVER.comboBonus);
      if (t.progress < t.arrows.length) { battleHit(1, false); return 'step'; }
      return t.miss === 0 ? 'perfect' : 'good';
    }
  },
  alert: {
    update:function(t, dt){
      t.el += dt;
      if (t.state === 'wait') {
        if (t.fakeAt >= 0 && t.el >= t.fakeAt) { t.state = 'fake'; t.fakeT = 0.35; t.fakeAt = -1; }
        else if (t.el >= t.wait) { t.state = 'go'; t.goT = 0; }
      } else if (t.state === 'fake') {
        t.fakeT -= dt; if (t.fakeT <= 0) t.state = 'wait';
      } else if (t.state === 'go') {
        t.goT += dt;
        if (t.goT > t.win) { taskMiss('늦었다!'); alertReset(t); }
      }
    },
    input:function(t, code){
      if (!isTapKey(code)) return null;
      if (t.state !== 'go') { taskMiss(t.state === 'fake' ? '함정 신호!' : '너무 빨라!'); alertReset(t); return 'miss'; }
      return t.goT <= t.win * 0.4 ? 'perfect' : 'good';
    }
  },
  sort: {
    update:function(t, dt){
      t.el += dt;
      if (t.el > t.time) { taskMiss('시간 초과!'); sortNext(t); }
    },
    input:function(t, code){
      if (code !== 'ArrowLeft' && code !== 'KeyA' && code !== 'ArrowRight' && code !== 'KeyD') return null;
      var saysBug = code === 'ArrowLeft' || code === 'KeyA';
      if (saysBug !== (t.card === 'bug')) { taskMiss('잘못 분류!'); sortNext(t); return 'miss'; }
      return t.el <= t.time * 0.4 ? 'perfect' : 'good';
    }
  }
};

// ---------- 스테이지 흐름 ----------
function startLayer(L){
  var isBoss = L === 3;
  G.layer = L; G.isBoss = isBoss; G.isMid = false;
  var count = isBoss ? BOSS.count : Math.round(LAYERS[L].count[G.routeKey] * MG_COUNT[G.stages[L]]);
  count = Math.max(1, count - G.pendingRefactor);
  G.pendingRefactor = 0;
  var pre = 0;
  if (G.pendingOpen) { pre = Math.floor(count / 2); G.pendingOpen = false; }
  // 아이템의 '다음 층' 효과 적용 (만능 패스: 작업 자동 완료, 집중 모드·황금 키보드: 이번 층 점수 배율)
  pre = Math.min(count - 1, pre + G.nextBuff.auto);
  G.layerMult = G.nextBuff.mult;
  G.nextBuff = { mult:1, auto:0 };
  var queue = [];
  if (isBoss) {   // 최종 보스: 이번 판의 미니게임을 골고루 섞음
    var pool = [];
    while (pool.length < count) pool = pool.concat(shuffle(G.stages));
    queue = pool.slice(0, count - pre);
  } else {
    for (var i = 0; i < count - pre; i++) queue.push(G.stages[L]);
  }
  G.queue = queue; G.total = count; G.pre = pre; G.idx = 0; G.lastCur = 0; G.lastDir = 1;
  G.task = newTask(queue[0], isBoss ? 'boss' : G.routeKey, L);
  G.layerMistakes = 0; G.layerPoints = 0; G.linterLeft = cnt('linter');
  G.outageT = 0; G.banner = 0; G.clearing = 0; G.ready = true;   // Space를 눌러야 시작
  G.snap = { score:G.score, play:G.playTime, mist:G.mistakes, fev:G.feverCount, out:G.outages };   // 엔딩 로그용
  battleStart(isBoss ? 'boss' : LAYERS[L].key);
  G.maxStage = Math.max(G.maxStage, L + 1);
  if (isBoss) G.reachedBoss = true;
  go('play');
}
// WARNING 중간보스: 다음 층 미니게임을 강한 패턴으로 미리 체험하는 점수 이벤트
function startMid(Lnext){
  G.isMid = true; G.midL = Lnext; G.midMg = G.stages[Lnext];
  G.midT = MID.time; G.midHits = 0; G.midGain = 0;
  G.lastCur = 0; G.lastDir = 1;
  G.task = newTask(G.midMg, 'warn', Lnext);
  G.banner = 0; G.clearing = 0; G.ready = true;   // Space를 눌러야 시작
  battleStart(LAYERS[Lnext].key, true);
  fx.flash = 0.7; fx.flashColor = '#ff3b3b';
  renderUI();
}
function midEnd(){
  G.midTotal += G.midGain;

  logAdd('⚠ WARNING', MG_INFO[G.midMg].name + ' 미리보기 (' + MID.time + '초)', '성공 ' + G.midHits + '회', '+' + fmt(G.midGain), '#ff6b6b');
  G.clearing = 1.5;
  battleHit(3, true, true); battleWin();
}

// ---------- 점수 배율 (카드 효과가 모두 여기로 모임) ----------
function routeMult(k){ return k === 'risk' ? (has('hazard') ? 2.5 : ROUTES.risk.mult) : ROUTES.safe.mult; }
function perfectMult(){ return has('craft') ? 2.2 : TASK.perfectMult; }
function workMult(combo){ return Math.pow(1.25, cnt('overtime')) * (has('streak') && combo >= 10 ? 1.3 : 1); }
function feverDuration(){ return FEVER.duration + cnt('party'); }
function x2(n){ return '×' + (Math.round(n * 100) / 100); }

function inFever(){ return G && G.feverT > 0; }
// 피버 연타: 아무 키 1회 = 점수. 꾹 누르기(자동 반복)는 인정하지 않음
function feverPress(){
  if (!inFever()) return;
  var pts = Math.round(FEVER.perPress * (G.isBoss || G.isMid ? 1 : routeMult(G.routeKey)) * Math.pow(1.5, cnt('party')));
  G.score += pts; G.feverGain += pts; G.feverSum += pts; G.feverPresses++; G.feverPressTotal++;
  fx.pops.push({ x:170 + Math.floor(rand() * 70), y:70 + Math.floor(rand() * 20), text:'+' + pts, color:rand() < 0.5 ? '#ff4fd8' : '#ffd84a', t:0.5 });
  fx.shake = 0.06;
  battleShot();
}
function endFever(){
  G.feverT = 0; G.fever = 0;
  showMsg('피버 종료! 연타 ' + G.feverPresses + '회 +' + fmt(G.feverGain) + '점', '#ff8ad8', 1.4);
}
function addFever(v){
  if (inFever()) return;
  if (!G.isBoss && !G.isMid && G.routeKey === 'risk') v *= FEVER.riskFill;
  G.fever = Math.min(1, G.fever + v);
  if (G.fever >= 1) {
    G.feverT = feverDuration(); G.feverCount++; G.feverPresses = 0; G.feverGain = 0;
    fx.flash = 0.8; fx.flashColor = '#ff4fd8';
  }
}

function layerClear(){
  if (G.isBoss) {
    var bonus = 2000 + Math.ceil(G.time) * 20;
    G.score += bonus; G.cleared = true;
    battleHit(3, true, true); battleWin();
    G.clearText = '출시 성공! +' + fmt(bonus);

    G.clearing = 1.6;
    fx.flash = 0.8; fx.flashColor = '#7be3a0';

  }
  var add = Math.round(300 * routeMult(G.routeKey) * Math.pow(1.5, cnt('bonuspay')));
  G.score += add; G.layerPoints += add; G.coins += COIN.clear;
  var txt = (G.layer + 1) + '층 · ' + LAYERS[G.layer].name + ' 완료! +' + fmt(add);
  if (has('flawless') && G.layerMistakes === 0) {
    var extra = Math.round(G.layerPoints * 0.5);
    G.score += extra; txt += '  무결점 +' + fmt(extra);

  fx.flash = 0.5; fx.flashColor = '#7be3a0';
}
function afterClear(){
  if (G.isBoss) { finish(true); return; }
  if (G.isMid) { G.isMid = false; openItemPick(); return; }   // WARNING 보상: 아이템 3개 중 1개
  if (G.layer < 2) { startMid(G.layer + 1); return; }   // 1·2층 뒤에는 다음 층 미니게임 WARNING
  afterStageEvents();
}
function afterStageEvents(){
  var ch = Math.min(0.9, BONUS.chance[G.routeKey] * (has('lucky') ? 1.5 : 1));
  if (rand() < ch) openBonus(); else openPick('reward');
}

// ---------- 보너스 스테이지 (방향키 러시) ----------
function mkBonusCmd(){ var a = []; for (var i = 0; i < BONUS.len; i++) a.push({ dir:ri(4), type:'n' }); return { arrows:a }; }
function openBonus(){
  G.bonusPlayed++;
  B = { t:BONUS.time, intro:1.6, done:0, cmd:mkBonusCmd(), progress:0, ended:false, endT:0, won:false, sp:null };
  go('bonus');
}
function bonusDir(d){
  if (scene !== 'bonus' || !B || B.intro > 0 || B.ended) return;
  if (d === B.cmd.arrows[B.progress].dir) {
    B.progress++;
    if (B.progress >= B.cmd.arrows.length) {
      B.done++; G.score += BONUS.perCmd; G.coins += COIN.bonus;
      fx.pops.push({ x:160, y:96, text:'+' + BONUS.perCmd, color:'#ffd84a', t:0.7 });
      B.cmd = mkBonusCmd(); B.progress = 0;
    }
  } else { B.progress = 0; fx.shake = 0.15; }
}
function endBonus(){
  B.ended = true; B.endT = 0;
  if (B.done >= BONUS.need) {
    B.won = true; B.sp = pick(SPECIALS); applySpecial(B.sp); G.bonusWon++;
    fx.flash = 0.7; fx.flashColor = '#ffd84a';
  }
  logAdd('보너스 스테이지', '핫픽스 러시 ' + B.done + '/' + BONUS.need + (B.won ? ' 성공 → ★ ' + B.sp.name : ' 실패'), B.won ? B.sp.desc : '', B.done ? '+' + fmt(B.done * BONUS.perCmd) : '', '#ffd84a');
}
function closeBonus(){ if (scene === 'bonus') openPick('reward'); }

// ---------- 카드·특수 보상 ----------
function applyCard(id){
  G.owned[id] = (G.owned[id] || 0) + 1;
  if (id === 'coffee') G.time += 10;
  if (id === 'refactor') G.pendingRefactor++;
}
function applySpecial(sp){
  G.specials.push(sp.id);
  if (sp.id === 'opensource') G.pendingOpen = true;
  if (sp.id === 'senior') G.seniorPicks = 1;
  if (sp.id === 'server') G.time += 20;
  if (sp.id === 'invest') G.score += 1000;
}
function drawOffers(){
  var pool = CARDS.filter(function(c){ return cnt(c.id) < c.max; });
  return shuffle(pool).slice(0, 3);
}
function openPick(ctxName){
  var picks = 1;
  if (ctxName === 'reward' && G.seniorPicks > 0) { picks = 2; G.seniorPicks = 0; }
  choice = { kind:'pick', ctx:ctxName, offers:drawOffers(), left:picks, total:picks, sel:0, t:CHOICE_TIME };
  go('pick');
}
function choosePick(i){
  if (scene !== 'pick' || !choice || !choice.offers[i]) return;
  var c = choice.offers[i];
  applyCard(c.id);
  logAdd(choice.ctx === 'start' ? '시작 카드' : '보상 카드', c.name, c.big, '', '#ffd84a');
  choice.offers.splice(i, 1);
  choice.left--;
  if (choice.left > 0 && choice.offers.length) { choice.sel = 0; choice.t = CHOICE_TIME; renderUI(); return; }
  if (choice.ctx === 'start') openRoute(0); else openRoulette();
}

// ---------- 루트 선택 ----------
function openRoute(L){
  G.layer = L;
  choice = { kind:'route', L:L, sel:0, t:CHOICE_TIME };
  go('route');
}
function chooseRoute(key){
  if (scene !== 'route') return;
  G.routeKey = key; G.routes.push(key === 'safe' ? 'S' : 'R');
  if (key === 'risk') G.riskCount++;
  startLayer(choice.L);
}

// ---------- 룰렛 ----------
function bonusChance(){
  var base = ROUTES[G.routeKey].bonus;
  return Math.min(0.9, base + G.pity + (has('lucky') ? 0.15 : 0));
}
function openRoulette(){
  var chance = bonusChance();
  var win = rand() < chance;
  var sp = pick(SPECIALS);
  RL = { chance:chance, win:win, sp:sp, t:0, revealed:false, revealAt:0, face:0 };
  go('roulette');
}
function revealRoulette(){
  RL.revealed = true; RL.revealAt = RL.t;
  logAdd('룰렛', '확률 ' + Math.round(RL.chance * 100) + '% → ' + (RL.win ? '★ ' + RL.sp.name : '꽝'), RL.win ? RL.sp.desc : '다음 룰렛 확률 +15%', '', RL.win ? '#ffd84a' : '#9aa2c7');
  if (RL.win) { applySpecial(RL.sp); G.pity = 0; fx.flash = 0.7; fx.flashColor = '#ffd84a'; }
  else { G.pity = Math.min(0.6, G.pity + 0.15); }
  renderUI();
}
function nextAfterRoulette(){
  if (scene !== 'roulette') return;
  openStageEvent();   // 룰렛 뒤: 상점·랜덤 카드 이벤트
}
function continueJourney(){
  var next = G.layer + 1;
  if (next <= 2) openRoute(next); else { G.routeKey = G.routeKey || 'safe'; startLayer(3); }
}

// ---------- 아이템: 뽑기 · WARNING 보상 · 랜덤 카드 · 상점 ----------
var EV = null;   // 아이템 이벤트 상태
function rollTier(odds){
  var r = rand() * 100, acc = 0, ks = ['common', 'rare', 'legend'];
  for (var i = 0; i < ks.length; i++) { acc += odds[ks[i]] || 0; if (r < acc) return ks[i]; }
  return 'common';
}
function rollItem(odds){ var tier = rollTier(odds); return pick(ITEMS.filter(function(it){ return it.tier === tier; })); }
function rollItems(odds, n){
  var out = [], guard = 0;
  while (out.length < n && guard++ < 60) { var it = rollItem(odds); if (out.indexOf(it) < 0) out.push(it); }
  return out;
}
function oddsText(o){ return ['common', 'rare', 'legend'].filter(function(k){ return o[k] > 0; }).map(function(k){ return TIERS[k].name + ' ' + o[k] + '%'; }).join(' · '); }
function itemLabel(it){ return '[' + TIERS[it.tier].name + '] ' + it.name; }
// 아이템 효과 적용. 점수형은 실제로 얻은 점수를 돌려줌
function applyItem(it){
  var f = it.fx; G.itemsGot.push(it.id);
  if (f.time) G.time += f.time;
  if (f.shield) G.shield += f.shield;
  if (f.fever) G.fever = Math.min(0.99, G.fever + f.fever);
  if (f.feverFull) G.fever = 0.99;
  if (f.coins) G.coins += f.coins;
  if (f.nextMult) G.nextBuff.mult *= f.nextMult;
  if (f.nextAuto) G.nextBuff.auto += f.nextAuto;
  if (f.score) { var v = Math.round((f.score[0] + rand() * (f.score[1] - f.score[0])) / 10) * 10; G.score += v; return v; }
  return null;
}
function gotText(it, v){ return itemLabel(it) + ' 획득! ' + it.big + (v != null ? ' → +' + fmt(v) + '점' : ''); }
function midOdds(){ for (var i = 0; i < ODDS.mid.length; i++) if (G.midHits >= ODDS.mid[i].min) return ODDS.mid[i].odds; return ODDS.mid[ODDS.mid.length - 1].odds; }

// WARNING 보상: 성공 횟수에 따라 등급 확률이 좋아지는 아이템 3개 중 1개
function openItemPick(){
  var odds = midOdds();
  EV = { kind:'mid', odds:odds, offers:rollItems(odds, 3), sel:0 };
  go('itempick');
}
function chooseItemPick(i){
  if (scene !== 'itempick' || !EV || !EV.offers[i]) return;
  var it = EV.offers[i], v = applyItem(it);
  toast(gotText(it, v), it.tier);
  logAdd('WARNING 보상', itemLabel(it), it.big + (v != null ? ' → +' + fmt(v) + '점' : ''), '', TIERS[it.tier].color);
  EV = null; afterStageEvents();
}
// 층 보상 뒤 이벤트: 대박 상점 / 일반 상점 / 랜덤 카드 / 없음
function openStageEvent(){
  var r = rand() * 100, acc = 0, kind = 'none', ks = ['bigshop', 'shop', 'mystery', 'none'];
  for (var i = 0; i < ks.length; i++) { acc += EVENTS[ks[i]]; if (r < acc) { kind = ks[i]; break; } }
  if (kind === 'none') { continueJourney(); return; }
  if (kind === 'mystery') { EV = { kind:'mystery', odds:ODDS.mystery, hidden:rollItems(ODDS.mystery, 3), sel:0, picked:-1, last:'' }; go('mystery'); return; }
  EV = { kind:kind, odds:ODDS[kind], offers:[], sold:[], rerolls:0, last:'', lastTier:null, buys:[], spent:0 };
  shopRoll(); go('shop');
}
function mysteryPick(i){
  if (scene !== 'mystery' || !EV || EV.picked >= 0 || !EV.hidden[i]) return;
  EV.picked = i;
  var it = EV.hidden[i], v = applyItem(it);
  EV.last = gotText(it, v); EV.lastTier = it.tier;
  logAdd('랜덤 카드', itemLabel(it), it.big + (v != null ? ' → +' + fmt(v) + '점' : ''), '', TIERS[it.tier].color);
  if (it.tier === 'legend') { fx.flash = 0.8; fx.flashColor = '#ffd84a'; }
  renderUI();
}
function shopRoll(){ EV.offers = rollItems(EV.odds, 3); EV.sold = [false, false, false]; }
function priceOf(it){ var p = PRICE[it.tier]; return EV.kind === 'bigshop' ? Math.round(p * SHOP.bigDiscount) : p; }
function rerollCost(){ return SHOP.reroll + SHOP.rerollStep * EV.rerolls; }
function gachaCost(){ return SHOP.gacha[EV.kind]; }
function shopBuy(i){
  if (scene !== 'shop' || !EV || !EV.offers[i] || EV.sold[i]) return;
  var it = EV.offers[i], p = priceOf(it);
  if (G.coins < p) { EV.last = '코인이 부족합니다 (' + p + '코인 필요)'; EV.lastTier = null; renderUI(); return; }
  G.coins -= p; EV.sold[i] = true; EV.buys.push(it.name); EV.spent += p;
  var v = applyItem(it); EV.last = '구매 · ' + gotText(it, v); EV.lastTier = it.tier; renderUI();
}
function shopReroll(){
  if (scene !== 'shop' || !EV) return;
  var c = rerollCost();
  if (G.coins < c) { EV.last = '코인이 부족합니다 (새로고침 ' + c + '코인)'; EV.lastTier = null; renderUI(); return; }
  G.coins -= c; EV.rerolls++; EV.spent += c; shopRoll(); EV.last = '진열을 새로고침했습니다'; EV.lastTier = null; renderUI();
}
function shopGacha(){
  if (scene !== 'shop' || !EV) return;
  var c = gachaCost();
  if (G.coins < c) { EV.last = '코인이 부족합니다 (뽑기 ' + c + '코인)'; EV.lastTier = null; renderUI(); return; }
  G.coins -= c;
  var it = rollItem(ODDS.gacha[EV.kind]), v = applyItem(it);
  EV.buys.push('뽑기 ' + it.name); EV.spent += c;
  EV.last = '뽑기 결과 · ' + gotText(it, v); EV.lastTier = it.tier;
  if (it.tier === 'legend') { fx.flash = 0.8; fx.flashColor = '#ffd84a'; }
  renderUI();
}
function leaveEvent(){
  if (scene !== 'shop' && scene !== 'mystery') return;
  if (scene === 'shop') logAdd(EV.kind === 'bigshop' ? '대박 상점' : '일반 상점', EV.buys.length ? EV.buys.join(', ') : '구경만 하고 나감',
    (EV.rerolls ? '새로고침 ' + EV.rerolls + '회 · ' : '') + (EV.spent ? '코인 ' + EV.spent + '개 사용' : ''), '', EV.kind === 'bigshop' ? '#ffd84a' : '#7be3a0');
  EV = null; continueJourney();
}

// 화면 위쪽에 잠깐 뜨는 알림 (아이템 획득 등)
var toastTimer = null;
function toast(text, tier){
  var el = document.getElementById('toast');
  el.textContent = text; el.style.borderColor = tier ? TIERS[tier].color : '#3a4378'; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 2600);
}

// ---------- 종료 ----------
function finish(cleared){
  if (G.finished) return;
  G.finished = true;
  if (G.time < 0) G.time = 0;
  var rec = {
    name:G.name, score:Math.round(G.score), cleared:!!cleared, stage:G.maxStage,
    routes:G.routes.join(''), mistakes:G.mistakes, left:Math.ceil(G.time),
    date:new Date().toISOString().slice(0, 10), t:Date.now()
  };
  if (!G.demo) saveRecord(rec);   // 데모 플레이 기록은 랭킹에 남기지 않음
  G.record = rec;
  if (!cleared && scene === 'play' && !G.isMid) logStage(false);   // 시간 종료된 층도 로그에 남김
  fadeTo(openLaunch);   // 페이드아웃 → 출시 컷신 → 엔딩(게임 로그) → 결과·랭킹
}

// ---------- 화면 페이드 ----------
var fade = { a:0, dir:0, cb:null, hold:0 };
var FADE_TIME = 0.7;
function fadeTo(cb){ if (fade.dir) return; fade.dir = 1; fade.cb = cb; }
function fadeReset(){ fade.a = 0; fade.dir = 0; fade.cb = null; fade.hold = 0; ui.style.opacity = ''; }
function fadeUpdate(dt){
  if (!fade.dir) return;
  if (fade.hold > 0) { fade.hold -= dt; return; }
  fade.a += fade.dir * dt / FADE_TIME;
  if (fade.dir > 0 && fade.a >= 1) {
    fade.a = 1; fade.dir = -1; fade.hold = 0.25;
    var cb = fade.cb; fade.cb = null; if (cb) cb();
  } else if (fade.dir < 0 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
  ui.style.opacity = String(Math.max(0, 1 - fade.a));
}

function drawWorker(x, y, pose){   // y = 발 위치
  var shirt = '#e8ebff', skin = '#f2c69b', hair = '#2b1d14', hop = 0;
  if (pose === 'cheer') hop = -Math.round(Math.abs(Math.sin(T * 9)) * 4);
  y += hop;
  R(x + 3, y - 7, 3, 6, '#2d3561'); R(x + 8, y - 7, 3, 6, '#2d3561'); R(x + 2, y - 1, 4, 1, '#111'); R(x + 8, y - 1, 4, 1, '#111');
  R(x + 2, y - 16, 10, 9, shirt); R(x + 6, y - 16, 2, 7, '#d2552d');
  if (pose === 'sad') {   // 고개를 떨군 채 서 있음
    R(x + 3, y - 21, 8, 7, skin); R(x + 3, y - 24, 8, 3, hair); R(x + 2, y - 23, 2, 5, hair);
    R(x + 7, y - 17, 1, 1, '#111'); R(x + 9, y - 17, 1, 1, '#111'); R(x + 7, y - 15, 3, 1, '#7a4a3a');
    R(x, y - 15, 2, 8, shirt); R(x + 12, y - 15, 2, 8, shirt);
    if (Math.floor(T * 2) % 2) R(x + 12, y - 24, 1, 2, '#9ad8ff');   // 식은땀
    return;
  }
  R(x + 3, y - 23, 8, 7, skin); R(x + 3, y - 26, 8, 3, hair); R(x + 2, y - 25, 2, 5, hair);
  R(x + 8, y - 21, 1, 2, '#111'); R(x + 10, y - 21, 1, 2, '#111'); R(x + 7, y - 18, 3, 1, '#7a2a2a');
  if (pose === 'cheer') { R(x, y - 27, 2, 11, shirt); R(x + 12, y - 27, 2, 11, shirt); R(x - 1, y - 29, 3, 2, skin); R(x + 12, y - 29, 3, 2, skin); }
  else { R(x, y - 15, 2, 7, shirt); R(x + 12, y - 15, 2, 7, shirt); }
}
function drawLaunch(){
  var t = LC.t, ok = G.cleared;
  R(0, 150, W, 30, ok ? '#3a2c5c' : '#1d1830'); R(0, 150, W, 1, ok ? '#5a4a86' : '#2a2342');   // 옥상 / 사무실 바닥
  R(96, 118, 128, 6, '#6b4f3a'); R(102, 124, 5, 26, '#4a3626'); R(213, 124, 5, 26, '#4a3626');   // 책상
  if (ok) {
    drawWorker(70, 150, t > 1.0 ? 'cheer' : 'stand');
    var cw = ['#4a90c2', '#d2552d', '#7a5cc2'];
    for (var c = 0; c < 3; c++) drawPerson(236 + c * 22, 132 - (t > 1.0 ? Math.round(Math.abs(Math.sin(T * 8 + c * 1.3)) * 3) : 0), cw[c]);   // 동료들 박수
  } else {
    drawWorker(70, 150, 'sad');
    var dark = t < 1.3 ? 0 : (t < 1.8 ? 0.18 : (t < 2.3 ? 0.32 : 0.45));   // 사무실 불이 하나씩 꺼짐
    if (dark) { ctx.globalAlpha = dark; R(0, 0, W, H, '#000000'); ctx.globalAlpha = 1; }
  }
  // 모니터
  var mx = 112, my = 54, mw = 96, mh = 58;
  R(mx - 3, my - 3, mw + 6, mh + 6, '#2d3561'); R(156, my + mh + 3, 8, 3, '#2d3561');
  var flash = ok && t > 1.0 && t < 1.15;
  R(mx, my, mw, mh, flash ? '#ffffff' : (ok ? '#0b1a14' : '#1a0b0f'));
  if (!ok) { ctx.globalAlpha = 0.1 + 0.06 * Math.sin(T * 6); disc(160, 83, 70, '#ff3b3b'); disc(160, 83, 52, '#ff3b3b'); ctx.globalAlpha = 1; R(mx, my, mw, mh, '#1a0b0f'); }
  var prog = ok ? Math.min(1, t / 1.0) : Math.min(0.72, t / 1.0 * 0.72);
  if (ok && t > 1.0) {
    if (!flash) { txt('SERVICE OPEN', 160, my + 22, 11, '#7be3a0', 'center'); txt('v1.0 · 배포 100%', 160, my + 40, 6, '#c8f0d8', 'center'); }
  } else if (!ok && t > 1.0) {
    txt('DEPLOY FAILED', 160, my + 22, 10, Math.floor(T * 4) % 2 ? '#ff5a5a' : '#a83030', 'center');
    txt('배포 연기…', 160, my + 40, 6.5, '#ffb0b0', 'center');
  } else {
    txt('배포 중…', 160, my + 18, 7, '#c8cff0', 'center');
    R(mx + 10, my + 30, mw - 20, 6, '#11152a'); R(mx + 10, my + 30, Math.round((mw - 20) * prog), 6, ok ? '#7be3a0' : '#ffb648');
    txt(Math.round(prog * 100) + '%', 160, my + 45, 6, '#9aa2c7', 'center');
  }
  if (ok) {   // 불꽃놀이
    [[66, 36, 1.1, '#ffd84a'], [254, 30, 1.45, '#ff4fd8'], [160, 20, 1.8, '#3ef2ff'], [104, 24, 2.3, '#7be3a0'], [222, 40, 2.6, '#ffd84a'], [40, 22, 2.9, '#ff8a5c']].forEach(function(b){
      var d = t - b[2];
      if (d > -0.35 && d < 0) { R(b[0], Math.round(b[1] + (-d / 0.35) * 70), 1, 4, '#fff1c4'); return; }   // 쏘아 올림
      if (d < 0 || d > 1.1) return;
      var rr = 3 + d * 24; ctx.globalAlpha = Math.max(0, 1 - d / 1.1);
      for (var k = 0; k < 14; k++) { var a = k / 14 * Math.PI * 2; R(Math.round(b[0] + Math.cos(a) * rr), Math.round(b[1] + Math.sin(a) * rr + d * d * 10), 2, 2, b[3]); }
      ctx.globalAlpha = 1;
    });
  }
  var ca = Math.max(0, Math.min(1, (t - 1.2) / 0.4));   // 자막
  if (ca > 0) {
    ctx.globalAlpha = ca * 0.8; R(0, 158, W, 18, '#000'); ctx.globalAlpha = ca;
    txt(ok ? '출시 성공! ' + G.name + ' 팀의 서비스가 세상에 나왔습니다' : '시간 종료… ' + G.name + ' 팀의 배포는 다음 스프린트로', 160, 167, 7, ok ? '#ffd84a' : '#ff8a8a', 'center');
    ctx.globalAlpha = 1;
  }
  if (t > 0.6) txt('Space 건너뛰기', W - 5, 6, 4.8, '#c8cff0', 'right');
}

// ---------- 엔딩: 이번 판의 선택과 결과를 순서대로 ----------
var END = null;
var END_STEP = 0.32;   // 한 줄씩 나타나는 간격(초)
function openEnding(){
  var rows = G.log.slice();
  rows.push({ tag:'플레이 기록', text:'퍼펙트 ' + G.perfects + '회 · 최대 콤보 ' + G.maxCombo + ' · 피버 ' + G.feverCount + '회(연타 ' + G.feverPressTotal + ')',
    det:'미스 ' + G.mistakes + '회(−' + G.missTime + '초) · 아이템 ' + G.itemsGot.length + '개 · 남은 코인 ' + G.coins, pts:'', c:'#9ad8ff', sum:true });
  END = { rows:rows, shown:0, t:0, next:FADE_TIME + 0.3, doneT:-1 };
  clearTimeout(toastTimer); document.getElementById('toast').style.display = 'none';   // 이전 알림이 엔딩을 가리지 않게
  go('ending');
}
function endRowHTML(r){
  return '<div class="erow' + (r.sum ? ' sum' : '') + '"><span class="et" style="color:' + r.c + '">' + esc(r.tag) + '</span>' +
    '<span class="ex">' + esc(r.text) + (r.det ? '<i>' + esc(r.det) + '</i>' : '') + '</span><span class="ep">' + esc(r.pts) + '</span></div>';
}
function endFootHTML(){
  if (END.shown < END.rows.length) return '<span class="key">Space</span> 모두 보기';
  return '최종 점수<b>' + fmt(G.record ? G.record.score : G.score) + '</b><span class="key">Enter</span> 또는 <span class="key">Space</span> 결과·랭킹 보기';
}
function endReveal(all){
  if (!END) return;
  var from = END.shown;
  END.shown = all ? END.rows.length : Math.min(END.rows.length, END.shown + 1);
  var list = document.getElementById('elist'), foot = document.getElementById('efoot');
  if (list) { list.insertAdjacentHTML('beforeend', END.rows.slice(from, END.shown).map(endRowHTML).join('')); list.scrollTop = list.scrollHeight; }
  if (foot) foot.innerHTML = endFootHTML();
}
function endingNext(){
  if (scene !== 'ending' || fade.dir) return;
  if (END.shown < END.rows.length) { endReveal(true); return; }
  fadeTo(function(){ END = null; go('result'); });
}
// 결과 등급 (점수 기준은 추정치)
var GRADE = { S:25000, A:18000 };
function gradeOf(){
  var sc = G.record ? G.record.score : G.score;
  if (G.cleared) return sc >= GRADE.S ? ['S', '#ffd84a'] : (sc >= GRADE.A ? ['A', '#3ef2ff'] : ['B', '#7be3a0']);
  return G.reachedBoss ? ['C', '#ff8a5c'] : ['D', '#9aa2c7'];
}
// 결과창 아래 TOP 5. 내가 5위 밖이면 마지막 줄에 내 순위를 덧붙임
function miniRank(rec, myRank){
  // 이번 판 기록(rec.t)을 기준으로 강조. 같은 닉네임의 예전 기록이 있어도 이번 판 순위가 기준
  var list = bestList(), top = list.slice(0, 5);
  var row = function(r, n){ return '<tr class="' + (r.t === rec.t ? 'me' : '') + '"><td class="n">' + n + '</td><td>' + esc(r.name) + '</td><td class="s">' + fmt(r.score) + '</td></tr>'; };
  var h = top.map(function(r, i){ return row(r, i + 1); }).join('');
  var shown = top.some(function(r){ return r.t === rec.t; });
  if (!shown) h += '<tr class="gap"><td colspan="3">⋯</td></tr>' + row(rec, myRank);
  return '<table class="mrk">' + h + '</table>';
}
function honor(){
  if (G.cleared && G.riskCount >= 3) return ['유니콘 스타트업 CTO', G.name + ' 팀, 신기술로 출시 성공!'];
  if (G.cleared) return ['출시 장인', G.name + ' 팀, 서비스 출시 성공!'];
  if (G.reachedBoss) return ['배포 직전의 개발자', '아깝다! 출시 D-Day에서 멈췄습니다'];
  if (G.maxStage >= 3) return ['QA 통과 대기 중', '테스트까지 왔습니다. 조금만 더!'];
  return ['열정 넘치는 인턴', '첫 커밋 완료! 수고하셨습니다'];
}

function go(s){ scene = s; sceneT = 0; renderUI(); }

  var list = bestList().slice(0, 10);

  return '<table class="rk">' + list.map(function(r, i){
    var cls = (i === 0 ? 'top1' : '') + (highlight && r.name === highlight ? ' me' : '');

    return '<tr class="' + cls + '"><td class="n">' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="s">' + fmt(r.score) + '</td><td class="b">' + badge + '</td></tr>';

function digit(code){ var m = /^(Digit|Numpad)([1-9])$/.exec(code); return m ? parseInt(m[2], 10) : 0; }
function handleKey(code){

  // 층을 끝낸 직후 Space 연타가 카드·루트 선택으로 넘어가지 않도록 잠깐 입력을 막음

  if (scene === 'idle') {
    if (code === 'KeyR') {
      var now = performance.now();
      resetPresses = resetPresses.filter(function(t){ return now - t < 3000; }); resetPresses.push(now);
      if (resetPresses.length >= 5) {
        resetPresses = [];

    }

    var d = digit(code);
    if (d) { choosePick(d - 1); return; }

    else if (isEnter) choosePick(choice.sel);
  } else if (scene === 'route') {
    var d2 = digit(code);
    if (d2 === 1) { chooseRoute('safe'); return; }
    if (d2 === 2) { chooseRoute('risk'); return; }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS','KeyA','KeyD'].indexOf(code) >= 0) { choice.sel = 1 - choice.sel; renderUI(); }
    else if (isEnter) chooseRoute(choice.sel === 0 ? 'safe' : 'risk');
  } else if (scene === 'itempick') {
    var d3 = digit(code);
    if (d3) { chooseItemPick(d3 - 1); return; }
    if (code === 'ArrowLeft' || code === 'KeyA') { EV.sel = (EV.sel + 2) % 3; renderUI(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { EV.sel = (EV.sel + 1) % 3; renderUI(); }
    else if (isEnter) chooseItemPick(EV.sel);

    if (EV.picked >= 0) { if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') leaveEvent(); return; }
    var d4 = digit(code);
    if (d4) { mysteryPick(d4 - 1); return; }
    if (code === 'ArrowLeft' || code === 'KeyA') { EV.sel = (EV.sel + 2) % 3; renderUI(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { EV.sel = (EV.sel + 1) % 3; renderUI(); }
    else if (isEnter) mysteryPick(EV.sel);
  } else if (scene === 'shop') {
    var d5 = digit(code);
    if (d5) { shopBuy(d5 - 1); return; }
    if (code === 'KeyR') shopReroll();
    else if (code === 'KeyG') shopGacha();
    else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Escape') leaveEvent();
  } else if (scene === 'roulette') {
    if (isEnter && RL.revealed) nextAfterRoulette();
  } else if (scene === 'play') {
    if (G.paused) { G.paused = false; renderUI(); return; }
    if (code === 'Escape') { G.paused = true; renderUI(); return; }
    if (G.ready) { if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') beginStage(); return; }   // 룰 확인 후 시작
    if (inFever()) { feverPress(); return; }   // 피버 중에는 아무 키나 연타
    taskInput(code);   // 현재 미니게임이 자기 키만 받음
  } else if (scene === 'bonus') {
    if (B && B.ended && B.endT > 0.6 && isEnter) closeBonus();
    else if (KEYMAP.hasOwnProperty(code)) bonusDir(KEYMAP[code]);
  } else if (scene === 'launch') {
    if (LC && LC.t > 0.6 && isEnter) launchNext();   // 컷신 건너뛰기 (보스전 Space 연타가 바로 넘기지 않게 0.6초 뒤부터)
  } else if (scene === 'ending') {
    if (sceneT > 0.5 && isEnter) endingNext();   // Enter·Space로만 넘어감 (자동·클릭으로 넘어가지 않음)
  } else if (scene === 'result') {
    // 1인 1회 플레이: 다시 도전 없이 처음 화면으로 (다음 사람 차례)
    if (code === 'Enter' || code === 'NumpadEnter' || code === 'Escape') go('idle');
  }
}

// ---------- 데모 플레이 (오락실 어트랙트 모드) ----------
// 실제 게임 로직을 그대로 쓰고 입력만 자동으로 넣는다. 기록은 저장하지 않는다.

  D = { name:'DEMO', typed:0, wait:0.9, phase:null, resultSeen:false };
  demoBadge.style.display = 'block';
  fadeReset(); END = null; LC = null;   // 진행 중이던 화면 전환이 있으면 취소
  G = null; choice = null; RL = null;
  go('nickname');
}
function endDemo(){
  demoActive = false; D = null; demoBadge.style.display = 'none'; fadeReset(); END = null; LC = null;
  G = null; choice = null; RL = null; fx.msg = null; fx.pops = [];
}
function stopDemo(toStart){ endDemo(); go(toStart ? 'nickname' : 'idle'); }
function demoTick(dt){
  D.wait -= dt;
  if (D.wait > 0) return;
  if (scene === 'nickname') {
    var inp = document.getElementById('nick');
    if (D.typed < D.name.length) { D.typed++; if (inp) inp.value = D.name.slice(0, D.typed); D.wait = 0.2; }
    else { newRun(D.name); G.demo = true; openPick('start'); D.wait = 1.0; }
  } else if (scene === 'pick') {
    if (D.phase !== 'pickSel') { choice.sel = ri(choice.offers.length); renderUI(); D.phase = 'pickSel'; D.wait = 1.0; }
    else { D.phase = null; choosePick(choice.sel); D.wait = 1.0; }
  } else if (scene === 'route') {
    if (D.phase !== 'routeSel') { choice.sel = rand() < 0.5 ? 0 : 1; renderUI(); D.phase = 'routeSel'; D.wait = 1.1; }
    else { D.phase = null; chooseRoute(choice.sel === 0 ? 'safe' : 'risk'); D.wait = 0.3; }
  } else if (scene === 'bonus') {
    if (!B || B.intro > 0) { D.wait = 0.1; return; }
    if (B.ended) { D.wait = 0.2; return; }
    var exp = B.cmd.arrows[B.progress].dir;
    if (rand() < 0.08) { bonusDir((exp + 1) % 4); D.wait = 0.4; return; }
    bonusDir(exp); D.wait = 0.2 + rand() * 0.15;
  } else if (scene === 'play' && G && G.ready) {   // 데모: 룰 카드를 잠깐 보여 준 뒤 시작
    if (D.phase !== 'ready') { D.phase = 'ready'; D.wait = 2.2; } else { D.phase = null; beginStage(); D.wait = 0.3; }
  } else if (scene === 'play' && G && inFever()) {
    feverPress(); D.wait = 0.09 + rand() * 0.06;   // 피버 연타
  } else if (scene === 'play' && G && G.task) {
    D.wait = 0.02;
    if (G.banner > 0 || G.clearing > 0 || G.finished) return;
    var t = G.task;
    if (t.mg === 'timing') {        // 대체로 구간 안에서, 가끔 퍼펙트·가끔 미스
      if (t.lock > 0) return;
      var half = zoneWidth(t) / 2, dist = Math.abs(t.cur - zoneCenter(t));
      if (D.aim == null) D.aim = rand() < 0.5 ? half * 0.25 : half * 0.85;
      if (dist <= D.aim) { taskInput('Space'); D.aim = null; D.wait = 0.3; }
      else if (rand() < 0.004) { taskInput('Space'); D.aim = null; D.wait = 0.4; }
    } else if (t.mg === 'command') {  // 빨간·? 화살표 앞에서 멈칫, 가끔 실수
      var a = t.arrows[t.progress], expect = a.type === 'rev' ? OPP[a.dir] : a.dir;
      if (rand() < 0.07) { taskInput(DIR_CODE[(expect + 1 + ri(3)) % 4]); D.wait = 0.55; return; }
      taskInput(DIR_CODE[expect]);
      D.wait = 0.22 + rand() * 0.2 + (a.type === 'rev' ? 0.3 : 0) + (a.type === 'hid' ? 0.25 : 0);
    } else if (t.mg === 'alert') {    // 초록불에 반응, 아주 가끔 성급하게
      if (t.state === 'go') { if (D.react == null) D.react = 0.12 + rand() * 0.22; if (t.goT >= D.react) { taskInput('Space'); D.react = null; D.wait = 0.2; } }
      else if (rand() < 0.0015) { taskInput('Space'); D.wait = 0.4; }
    } else if (t.mg === 'sort') {     // 잠깐 보고 판단, 가끔 오판
      if (D.think == null) D.think = 0.25 + rand() * 0.45;
      if (t.el >= D.think) { var ok = t.card === 'ok'; if (rand() < 0.08) ok = !ok; taskInput(ok ? 'ArrowRight' : 'ArrowLeft'); D.think = null; D.wait = 0.15; }
    }
  } else if (scene === 'itempick') {          // 데모: 아이템 하나 고르기
    if (D.phase !== 'itemSel') { EV.sel = ri(3); renderUI(); D.phase = 'itemSel'; D.wait = 1.0; }
    else { D.phase = null; chooseItemPick(EV.sel); D.wait = 0.8; }
  } else if (scene === 'mystery') {           // 데모: 카드 뒤집고 결과 보기
    if (EV.picked < 0) { if (D.phase !== 'flipSel') { EV.sel = ri(3); renderUI(); D.phase = 'flipSel'; D.wait = 0.9; } else { D.phase = null; mysteryPick(EV.sel); D.wait = 1.6; } }
    else { leaveEvent(); D.wait = 0.6; }
  } else if (scene === 'shop') {              // 데모: 살 수 있는 가장 싼 것 하나 사고 나가기
    if (D.phase !== 'shopped') {
      var best = -1;
      EV.offers.forEach(function(it, i){ if (!EV.sold[i] && G.coins >= priceOf(it) && (best < 0 || priceOf(it) < priceOf(EV.offers[best]))) best = i; });
      if (best >= 0) shopBuy(best);
      D.phase = 'shopped'; D.wait = 1.4;
    } else { D.phase = null; leaveEvent(); D.wait = 0.6; }
  } else if (scene === 'roulette') {
    if (!RL.revealed) { D.wait = 0.2; return; }
    if (D.phase !== 'rlSeen') { D.phase = 'rlSeen'; D.wait = 1.6; return; }
    D.phase = null; nextAfterRoulette(); D.wait = 0.8;
  } else if (scene === 'ending') {         // 데모: 로그가 다 나온 뒤 잠깐 보여 주고 결과로
    if (!END || END.shown < END.rows.length) { D.wait = 0.2; return; }
    if (D.phase !== 'endSeen') { D.phase = 'endSeen'; D.wait = 3; return; }
    D.phase = null; endingNext(); D.wait = 1.5;
  } else if (scene === 'result') {
    if (!D.resultSeen) { D.resultSeen = true; D.wait = 7; return; }
    stopDemo(false);
  }
}

// ---------- 업데이트 ----------
function update(dt){
  T += dt; sceneT += dt;
  fadeUpdate(dt);
  if (fx.shake > 0) fx.shake = Math.max(0, fx.shake - dt);
  if (fx.flash > 0) fx.flash = Math.max(0, fx.flash - dt * 2.5);
  if (fx.msg) { fx.msg.t -= dt; if (fx.msg.t <= 0) fx.msg = null; }
  fx.pops = fx.pops.filter(function(p){ p.t -= dt; p.y -= dt * 25; return p.t > 0; });
  if (demoActive && D) demoTick(dt);
  else if (scene === 'idle' && sceneT > DEMO_IDLE_WAIT) startDemo();

  if (scene === 'play' && G && !G.paused) battleUpdate(dt);   // 전투 연출은 안내·피버·클리어 중에도 움직임
  if (scene === 'play' && G && !G.finished) {
    if (G.paused) return;
    if (G.ready) {   // 시작 대기: 시간·미니게임 정지. 부스 안전장치로 입력 없이 3분이면 처음 화면으로
      if (!demoActive && performance.now() - lastInputAt > IDLE_ABANDON * 1000) go('idle');
      return;
    }
    if (G.banner > 0) { G.banner -= dt; return; }
    // 피버 연타 구간: 미니게임과 제한 시간이 멈춤
    if (G.feverT > 0) { G.feverT -= dt; if (G.feverT <= 0) endFever(); return; }
    if (G.clearing > 0) { G.clearing -= dt; if (G.clearing <= 0) afterClear(); return; }
    if (G.isMid) {   // 중간보스는 자체 타이머, 본 게임 시간은 멈춤
      G.midT -= dt;
      if (G.midT <= 0) { G.midT = 0; midEnd(); return; }
    } else { G.time -= dt; G.playTime += dt; }
    if (G.timeHit > 0) G.timeHit -= dt;
    if (G.lastHitMark) { G.lastHitMark.t -= dt; if (G.lastHitMark.t <= 0) G.lastHitMark = null; }
    MGX[G.task.mg].update(G.task, dt);
    if (G.isBoss) {
      G.outageT += dt;
      if (G.outageT >= BOSS.outageEvery) {
        G.outageT -= BOSS.outageEvery;
        G.time -= BOSS.outagePenalty; G.outages++;
        fx.flash = 0.8; fx.flashColor = '#ff3b3b'; fx.shake = 0.35;
        showMsg('장애 발생! 제한 시간 −' + BOSS.outagePenalty + '초', '#ff5a5a', 1.2);
        battleMiss(true);
      }
    }
    if (!G.isMid && G.time <= 0) { G.time = 0; finish(false); }
  } else if ((scene === 'pick' || scene === 'route') && choice) {
    // 선택에는 시간 제한이 없음. 부스에서 자리를 비운 판이 남지 않도록 입력 없이 3분이 지나면 처음 화면으로
    if (!demoActive && performance.now() - lastInputAt > IDLE_ABANDON * 1000) go('idle');
  } else if (scene === 'itempick' || scene === 'mystery' || scene === 'shop') {
    if (!demoActive && performance.now() - lastInputAt > IDLE_ABANDON * 1000) { EV = null; go('idle'); }
  } else if (scene === 'roulette' && RL) {
    RL.t += dt;
    if (!RL.revealed) {
      var f = Math.floor(RL.t * 14) % SPECIALS.length;
      if (f !== RL.face) { RL.face = f; var sp = document.getElementById('spin'); if (sp) sp.textContent = (f % 2 ? '꽝' : SPECIALS[f].name); }
      if (RL.t >= 1.4) revealRoulette();
    } else if (RL.t - RL.revealAt >= 3) {
      nextAfterRoulette();
    }
  } else if (scene === 'bonus' && B) {
    if (B.intro > 0) B.intro -= dt;
    else if (!B.ended) { B.t -= dt; if (B.t <= 0) { B.t = 0; endBonus(); } }
    else { B.endT += dt; if (B.endT >= 2.4) closeBonus(); }
  } else if (scene === 'launch' && LC) {
    if (!fade.dir) LC.t += dt;   // 페이드인이 끝난 뒤부터 연출 시작
    if (LC.t >= LC.dur) launchNext();   // 컷신은 짧은 연출이라 끝나면 엔딩으로 이어짐
  } else if (scene === 'ending' && END) {
    END.t += dt;
    if (END.shown < END.rows.length) { if (END.t >= END.next) { endReveal(false); END.next = END.t + END_STEP; } }
    else if (END.doneT < 0) END.doneT = END.t;   // 다 나온 뒤에는 Enter·Space를 누를 때까지 그대로
  }
  // 결과 화면은 자동으로 처음 화면으로 돌아가지 않음 (Enter·Esc를 눌러야 다음 사람 차례)
  if (scene === 'result' && G && G.record && !G.countDone) {   // 점수 카운트업 (약 1초)
    var rn = document.getElementById('rnum');
    if (rn) {
      var k = Math.max(0, Math.min(1, (sceneT - 0.35) / 1.0)), e = 1 - Math.pow(1 - k, 3);
      rn.textContent = fmt(Math.round(G.record.score * e));
      if (k >= 1) G.countDone = true;
    }
  }
}

// ---------- 그리기 ----------
function R(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || 'bold') + ' ' + size + 'px "Malgun Gothic","맑은 고딕",sans-serif';
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function hash(n){ var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

function drawPerson(x, y, shirt){
  R(x + 2, y, 8, 3, '#3b2b20'); R(x + 2, y + 3, 8, 5, '#3b2b20');
  R(x + 1, y + 8, 10, 10, shirt); R(x, y + 10, 2, 6, shirt); R(x + 10, y + 10, 2, 6, shirt);
}
// 원(도트) 채우기
function disc(cx, cy, r, c){ for (var dy = -r; dy <= r; dy++) { var w = Math.round(Math.sqrt(r * r - dy * dy)); R(cx - w, cy + dy, w * 2, 1, c); } }
// 결과별 배경 ① 출시 성공: 밤샘이 끝난 새벽 도시 + 색종이 (시작 화면의 밤 도시와 대비)
var CONFETTI = ['#ffd84a', '#ff4fd8', '#3ef2ff', '#7be3a0', '#ff8a5c', '#ffffff'];
function drawDawn(){
  var bands = ['#27306a', '#3b3a82', '#5f4590', '#8c4f92', '#c45f86', '#ee7f78', '#ffa46e', '#ffc884'];
  for (var i = 0; i < bands.length; i++) R(0, i * 16, W, 16, bands[i]);
  R(0, 128, W, 52, '#ffc884');
  for (var st = 0; st < 14; st++) R(Math.floor(hash(st + 300) * W), Math.floor(hash(st + 340) * 30), 1, 1, '#8a90d0');   // 사라져 가는 별
  ctx.globalAlpha = 0.35; disc(160, 118, 30, '#fff1c4'); ctx.globalAlpha = 1;
  disc(160, 118, 20, '#ffe08a'); disc(160, 118, 15, '#fff4c8');                                                       // 떠오르는 해
  var bx = [6, 46, 92, 196, 236, 280], bw = [34, 40, 44, 38, 40, 36], bh = [72, 96, 64, 84, 100, 70];
  for (var b = 0; b < bx.length; b++) {
    var top = H - bh[b];
    R(bx[b], top, bw[b], bh[b], '#3a2c5c');
    for (var wy = top + 6; wy < H - 6; wy += 9) for (var wx = bx[b] + 4; wx < bx[b] + bw[b] - 5; wx += 8)
      R(wx, wy, 4, 4, hash(wx * 5 + wy * 3 + b) > 0.82 ? '#ffd8a0' : '#2e2350');   // 불이 거의 꺼진 창문
  }
  var conf = scene === 'launch' && LC ? Math.max(0, Math.min(1, (LC.t - 1.0) / 0.6)) : 1;   // 컷신에서는 배포가 끝난 뒤부터
  for (var k = 0; k < Math.round(46 * conf); k++) {   // 색종이
    var cx = (hash(k) * W + Math.sin(T * 1.5 + k) * 6 + W) % W, cy = (hash(k + 90) * H + T * (14 + hash(k + 40) * 18)) % (H + 6) - 3;
    R(Math.round(cx), Math.round(cy), Math.floor(T * 6 + k) % 2 ? 2 : 1, 2, CONFETTI[k % CONFETTI.length]);
  }
}
// 결과별 배경 ② 시간 종료: 비 오는 밤의 야근 사무실
function drawRainOffice(){
  R(0, 0, W, H, '#151a30'); R(0, 118, W, 62, '#1d1830'); R(0, 116, W, 2, '#2a2342');
  R(24, 12, 272, 88, '#2a3150'); R(28, 16, 264, 80, '#0a0f22');                 // 큰 창
  for (var bb = 0; bb < 7; bb++) { var bx = 34 + bb * 38, bh = 26 + Math.floor(hash(bb + 7) * 40); R(bx, 96 - bh, 30, bh, '#121733');
    for (var wy = 96 - bh + 4; wy < 92; wy += 8) for (var wx = bx + 4; wx < bx + 26; wx += 7) if (hash(wx + wy * 3) > 0.86) R(wx, wy, 3, 3, '#5a5a3a'); }
  for (var r = 0; r < 70; r++) {   // 빗줄기 (창 안쪽)
    var rx = 28 + Math.floor(hash(r + 11) * 262), ry = 16 + ((hash(r + 61) * 80 + T * (90 + hash(r) * 40)) % 76);
    ctx.globalAlpha = 0.55; R(rx, Math.floor(ry), 1, 4, '#6a7ac0'); ctx.globalAlpha = 1;
  }
  for (var f = 0; f < 3; f++) R(28 + f * 88 + 87, 16, 2, 80, '#2a3150');        // 창틀
  R(28, 55, 264, 2, '#2a3150');
}
function drawBg(key, battle){   // battle: 전투 중이면 책상·동료를 치워 무대를 비움

    R(267, 21, 3, 3, '#cfc89a'); R(271, 25, 2, 2, '#cfc89a');
    var bx = [10, 52, 96, 150, 196, 240, 284], bw = [36, 40, 46, 40, 38, 38, 32], bh = [80, 110, 70, 125, 90, 105, 75];

var ARROW_BMP = ['....#....', '...###...', '..#####..', '.#######.', '#########', '...###...', '...###...', '...###...', '...###...'];
var AN = ARROW_BMP.length;
function drawArrow(x, y, dir, color, cell){
  ctx.fillStyle = color;
  for (var r = 0; r < AN; r++) for (var c = 0; c < AN; c++) {
    if (ARROW_BMP[r][c] !== '#') continue;
    var px, py;
    if (dir === 0) { px = c; py = r; } else if (dir === 1) { px = AN - 1 - r; py = c; }
    else if (dir === 2) { px = c; py = AN - 1 - r; } else { px = r; py = c; }
    ctx.fillRect(x + px * cell, y + py * cell, cell, cell);
  }
}
function boxBorder(x, y, w, h, c, dashed){
  if (!dashed) { R(x, y, w, 1, c); R(x, y + h - 1, w, 1, c); R(x, y, 1, h, c); R(x + w - 1, y, 1, h, c); return; }
  for (var i = 0; i < w; i += 3) { R(x + i, y, 2, 1, c); R(x + i, y + h - 1, 2, 1, c); }
  for (var j = 0; j < h; j += 3) { R(x, y + j, 1, 2, c); R(x + w - 1, y + j, 1, 2, c); }
}

function burst(x, y, n, colors, power){

}
function battleHit(power, kill, last){

function battleUpdate(dt){
  if (!BT) return;
  var h = BT.hero; h.t += dt;
  if (h.st === 'run') { h.x += (HERO_X - h.x) * Math.min(1, dt * 6); if (Math.abs(h.x - HERO_X) < 0.5) { h.x = HERO_X; h.st = 'idle'; } }
  if ((h.st === 'atk' && h.t > 0.2) || (h.st === 'hurt' && h.t > 0.35)) { h.st = 'idle'; h.t = 0; }
  var e = BT.enemy;
  if (e) {
    e.t += dt;
    if (e.st === 'walk') { e.x += (e.tx - e.x) * Math.min(1, dt * 9); if (Math.abs(e.x - e.tx) < 0.6) { e.x = e.tx; e.st = 'idle'; } }
    if (e.st === 'atk' && e.t > 0.35) { e.st = 'idle'; e.t = 0; }
    if (e.hit > 0) e.hit -= dt;
    if (e.kx > 0) e.kx = Math.max(0, e.kx - dt * 40);
  }
  BT.shots = BT.shots.filter(function(s){
    s.x += s.vx * dt;
    if (BT.enemy && s.x >= BT.enemy.x - (BT.isBoss ? 22 : 10)) { BT.enemy.hit = 0.08; BT.enemy.kx = 2; burst(s.x, s.y, 3, [s.c, '#ffffff']); return false; }

}

// ② 커맨드 입력: 방향키 줄
function drawArrowRow(t){
  var n = t.arrows.length, bw = 22, gap = 3, totalW = n * bw + (n - 1) * gap;
  var ax = Math.round(160 - totalW / 2), ay = 143;
  var bob = Math.round(Math.sin(T * 10) * 0.6);
  for (var i = 0; i < n; i++) {
    var a = t.arrows[i], bx = ax + i * (bw + gap), by = ay;
    var isDone = i < t.progress, isCur = i === t.progress;
    if (isCur) by += bob;
    if (isDone) {
      R(bx, by, bw, bw, '#2b8a6e');
      drawArrow(bx + 2, by + 2, a.type === 'rev' ? OPP[a.dir] : a.dir, '#ffffff', 2);
      continue;
    }
    R(bx, by, bw, bw, '#1b2140');
    var bc = a.type === 'rev' ? '#ff5a5a' : (a.type === 'hid' ? '#9aa2c7' : '#e8ebff');
    boxBorder(bx, by, bw, bw, bc, a.type === 'hid');
    if (isCur) boxBorder(bx - 1, by - 1, bw + 2, bw + 2, '#ffffff');
    if (a.type === 'hid' && !isCur) txt('?', bx + bw / 2, by + bw / 2 + 0.5, 10, '#9aa2c7', 'center');
    else drawArrow(bx + 2, by + 2, a.dir, a.type === 'rev' ? '#ff5a5a' : '#e8ebff', 2);
  }
  var hasRev = t.arrows.some(function(a, i){ return a.type === 'rev' && i >= t.progress; });
  var hasHid = t.arrows.some(function(a, i){ return a.type === 'hid' && i > t.progress; });
  if (hasRev || hasHid) hintLine((hasRev ? '빨간 화살표는 반대 방향으로!' : '') + (hasRev && hasHid ? '   ' : '') + (hasHid ? '? 는 차례가 되면 공개' : ''), '#ff8a8a');
  else hintLine('방향키(또는 WASD)로 화살표 순서대로');
}

    case 'bonuspay': return '층 클리어 ' + x2(Math.pow(1.5, n));

    case 'hazard':   return '위험 루트 ×2.5';

  var bgKey = 'idle';
  if (G && (scene === 'launch' || scene === 'ending' || scene === 'result')) bgKey = G.cleared ? 'dawn' : 'rain';   // 끝난 뒤: 결과별 배경
  else if (G && (scene === 'play' || scene === 'route' || scene === 'pick' || scene === 'roulette' || scene === 'bonus' || scene === 'itempick' || scene === 'mystery' || scene === 'shop')) {
    bgKey = scene === 'pick' && choice && choice.ctx === 'start' ? 'plan' : (G.layer === 3 ? 'boss' : LAYERS[G.isMid ? G.midL : G.layer].key);
  }
  drawBg(bgKey, scene === 'play');
  var dim = scene === 'launch' ? 0 : (scene === 'result' ? 0.3 : (scene === 'ending' ? 0.5 : 0.55));
  if (scene !== 'play' && scene !== 'idle' && dim > 0) { ctx.globalAlpha = dim; R(0, 0, W, H, '#05060c'); ctx.globalAlpha = 1; }
  if (scene === 'launch' && G && LC) drawLaunch();
  if (scene === 'idle') { ctx.globalAlpha = 0.35; R(0, 0, W, H, '#05060c'); ctx.globalAlpha = 0.35; R(0, 0, 175, H, '#05060c'); ctx.globalAlpha = 1; }
  if (scene === 'play' && G) drawPlay();
  if (scene === 'bonus' && B) { ctx.globalAlpha = 0.3; R(0, 0, W, H, '#05060c'); ctx.globalAlpha = 1; drawBonus(); }
  ctx.restore();
  if (fx.flash > 0) { ctx.globalAlpha = Math.min(0.5, fx.flash * 0.5); R(0, 0, W, H, fx.flashColor); ctx.globalAlpha = 1; }
  if (fade.a > 0) { ctx.globalAlpha = Math.min(1, fade.a); R(0, 0, W, H, '#000000'); ctx.globalAlpha = 1; }
}

// ---------- 루프 ----------
var last = performance.now(), frozen = false;   // frozen: 점검용 화면 고정
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!frozen) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
renderUI();
if (/[?&]demo\b/.test(location.search)) startDemo();   // 주소 끝에 ?demo 를 붙이면 바로 데모 재생

// 점검용 훅 (게임 동작에는 영향 없음)
window.__RR = {
  get scene(){ return scene; }, get G(){ return G; }, get choice(){ return choice; }, get RL(){ return RL; },
  step:function(sec){ var n = Math.round(sec * 60); for (var i = 0; i < n; i++) update(1 / 60); draw(); },
  key:function(code){ document.dispatchEvent(new KeyboardEvent('keydown', { code:code, key:code, bubbles:true })); },
  records:loadRecords, best:bestList, get storageOK(){ return storageOK; },
  get demo(){ return demoActive; }, startDemo:startDemo,
  get B(){ return B; }, get EV(){ return EV; }, get END(){ return END; }, get fade(){ return fade; }, get LC(){ return LC; }, freeze:function(b){ frozen = !!b; },
  events:{ openStageEvent:openStageEvent, openItemPick:openItemPick },
  roll:{ tier:rollTier, item:rollItem, apply:applyItem, ODDS:ODDS, EVENTS:EVENTS, ITEMS:ITEMS },
  bonusExpected:function(){ return B.cmd.arrows[B.progress].dir; },
  task:function(){ return G && G.task; },
  input:function(code){ return taskInput(code); },
  zone:function(){ var t = G.task; return { cur:t.cur, c:zoneCenter(t), w:zoneWidth(t), target:zoneTarget(t), factor:widthFactor() }; },
  // 지금 작업을 정답으로 처리 (흐름 점검용)
  cheat:function(){
    var t = G && G.task; if (!t) return null;
    if (t.mg === 'timing') { t.cur = zoneCenter(t); t.lock = 0; return taskInput('Space'); }
    if (t.mg === 'command') { var a = t.arrows[t.progress]; return taskInput(DIR_CODE[a.type === 'rev' ? OPP[a.dir] : a.dir]); }
    if (t.mg === 'alert') { t.state = 'go'; t.goT = 0; return taskInput('Space'); }
    if (t.mg === 'sort') { t.el = 0; return taskInput(t.card === 'ok' ? 'ArrowRight' : 'ArrowLeft'); }
  }
};
})();
</script>
