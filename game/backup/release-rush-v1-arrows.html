<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리즈 러시</title>
<style>
html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:#e8ebff;user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;background:#0b0f1e;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.panel{background:rgba(11,15,30,.94);border:.25em solid #3a4378;border-radius:.6em;padding:1.6em 2em;box-shadow:0 0 0 .25em #0b0f1e}
h2{margin:0 0 .3em;font-size:2.4em;letter-spacing:-.02em}
.sub{color:#9aa2c7;font-size:1.3em}
.key{display:inline-block;background:#2d3561;border-radius:.3em;padding:0 .45em;font-weight:700;color:#ffd84a}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
/* idle */
.idle{position:absolute;inset:0;display:grid;grid-template-columns:1.15fr 1fr;gap:3em;align-items:center;padding:0 5em}
.logo{text-shadow:.08em .08em 0 #000,0 0 .6em #05060c}
.logo .t1{font-size:5.2em;font-weight:900;letter-spacing:.02em;line-height:1;color:#3ef2ff;text-shadow:.08em .08em 0 #ff4fd8}
.logo .t2{font-size:2.6em;font-weight:900;margin-top:.3em}
.logo .t3{font-size:1.5em;color:#ffd84a;margin-top:.4em}
.logo .start{font-size:1.7em;margin-top:2.2em;font-weight:700}
.logo .howto{font-size:1.15em;color:#9aa2c7;margin-top:1em;line-height:1.7}
.rank h3{margin:0 0 .5em;font-size:1.8em;color:#ffd84a}
table.rk{width:100%;border-collapse:collapse;font-size:1.25em}
table.rk td{padding:.3em .4em;border-bottom:.08em solid #262d55;white-space:nowrap}
table.rk td.n{color:#9aa2c7;width:2em}
table.rk td.s{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.rk td.b{text-align:right;color:#7be3a0;font-size:.8em;width:4.5em}
table.rk tr.me td{background:rgba(62,242,255,.15);color:#3ef2ff}
table.rk tr.top1 td.n{color:#ffd84a}
.empty{color:#9aa2c7;font-size:1.2em;padding:1em 0}
.warn{color:#ff8a5c;font-size:1.1em;margin-top:.8em}
/* nickname */
.nick input{font:inherit;font-size:2.2em;width:9em;padding:.25em .5em;border-radius:.3em;border:.12em solid #3ef2ff;background:#141933;color:#fff;outline:none;margin:.6em 0 .3em}
.nick .err{color:#ff8a5c;font-size:1.2em;min-height:1.5em}
.btn{font:inherit;font-size:1.5em;font-weight:700;background:#3ef2ff;color:#0b0f1e;border:none;border-radius:.4em;padding:.4em 1.2em;cursor:pointer}
.btn.ghost{background:#2d3561;color:#e8ebff}
/* cards */
.picktitle{font-size:2.2em;font-weight:900;margin-bottom:.2em;text-shadow:.06em .06em 0 #000}
.cards{display:flex;gap:1.6em;margin-top:1.4em}
.cardc{width:15em;min-height:17em;background:#141933;border:.25em solid #3a4378;border-radius:.6em;padding:1.2em;cursor:pointer;position:relative;transition:transform .08s}
.cardc:hover,.cardc.sel{border-color:#3ef2ff;transform:translateY(-.4em)}
.cardc .no{position:absolute;top:.6em;right:.8em;font-size:1.3em;font-weight:900;color:#ffd84a}
.cardc .tg{display:inline-block;font-size:1em;background:#2d3561;border-radius:.3em;padding:.05em .5em;color:#9aa2c7}
.cardc .nm{font-size:1.9em;font-weight:900;margin:.5em 0 .4em}
.cardc .ds{font-size:1.3em;color:#c8cff0;line-height:1.5}
.cardc .own{font-size:1.05em;color:#7be3a0;margin-top:.8em}
.cd{margin-top:1.4em;font-size:1.2em;color:#9aa2c7;text-shadow:.06em .06em 0 #000}
/* route */
.routes{display:flex;gap:2em;margin-top:1.4em}
.rt{width:24em;background:#141933;border:.3em solid #3a4378;border-radius:.6em;padding:1.4em 1.6em;cursor:pointer}
.rt.safe.sel,.rt.safe:hover{border-color:#5ccfae}
.rt.risk.sel,.rt.risk:hover{border-color:#ff8a5c}
.rt .lb{font-size:1.1em;font-weight:700}
.rt.safe .lb{color:#5ccfae}.rt.risk .lb{color:#ff8a5c}
.rt .nm{font-size:2.2em;font-weight:900;margin:.2em 0 .5em}
.rt ul{margin:0;padding-left:1.2em;font-size:1.3em;line-height:1.7;color:#c8cff0}
/* roulette */
.rl{text-align:center;min-width:30em}
.rl .ch{font-size:1.4em;color:#9aa2c7}
.rl .spin{font-size:3em;font-weight:900;margin:.5em 0;min-height:1.3em}
.rl .res{font-size:1.4em;min-height:3em;line-height:1.6}
.rl.win .spin{color:#ffd84a}
.rl.lose .spin{color:#9aa2c7}
/* result */
.result{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:3em;align-items:center;padding:0 5em}
.result>div:first-child{text-shadow:.08em .08em 0 #000,0 0 .6em #05060c}
.result .ttl{font-size:1.4em;color:#9aa2c7}
.result .big{font-size:5em;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.result .badge{display:inline-block;background:#ff4fd8;color:#fff;font-weight:900;padding:.1em .6em;border-radius:.3em;font-size:1.3em;margin-top:.3em}
.result .hon{font-size:2.4em;font-weight:900;color:#ffd84a;margin-top:.5em}
.result .msg{font-size:1.4em;margin-top:.3em}
.result .stats{font-size:1.2em;color:#c8cff0;margin-top:1em;line-height:1.8}
.result .act{margin-top:1.4em;font-size:1.3em;color:#9aa2c7}
#demoBadge{position:absolute;right:1.2%;top:11%;display:none;pointer-events:none;background:rgba(255,79,216,.92);color:#fff;font-weight:900;padding:.35em .9em;border-radius:.3em;font-size:calc(min(100vw,177.78vh)/100*1.3);letter-spacing:.04em;z-index:5}
#demoBadge span{animation:blink 1s steps(2,start) infinite}
.pause{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;flex-direction:column}
.pause b{font-size:3em}
.pause span{font-size:1.4em;color:#9aa2c7;margin-top:.5em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui"></div>
  <div id="demoBadge">DEMO PLAY · <span>아무 키나 누르면 시작</span></div>
</div>
<script>
(function(){
'use strict';

// ---------- 기본 설정 ----------
var W = 320, H = 180, S = 4;
var TOTAL_TIME = 60;
var CHOICE_TIME = 10;
var STORE_KEY = 'releaseRush.records.v1';
var NAME_KEY = 'releaseRush.lastName.v1';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
cv.width = W * S; cv.height = H * S;
var ui = document.getElementById('ui');
var stage = document.getElementById('stage');

function fit(){ var r = stage.getBoundingClientRect(); ui.style.fontSize = (r.width / 100) + 'px'; }
window.addEventListener('resize', fit); fit();

// 테스트용 시드 (?seed=123). 기본은 Math.random
var seedMatch = /[?&]seed=(\d+)/.exec(location.search);
var rand = Math.random;
if (seedMatch) {
  var sd = parseInt(seedMatch[1], 10) >>> 0;
  rand = function(){ sd |= 0; sd = sd + 0x6D2B79F5 | 0; var t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function ri(n){ return Math.floor(rand() * n); }
function pick(arr){ return arr[ri(arr.length)]; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = ri(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

// ---------- 게임 데이터 ----------
var OPP = [2, 3, 0, 1]; // 위 오른 아래 왼
var KEYMAP = { ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3 };

var LAYERS = [
  { key:'plan', name:'기획',
    safe:{ len:4, count:3, rev:0,    hid:0 },
    risk:{ len:5, count:3, rev:0.25, hid:0 } },
  { key:'dev', name:'개발',
    safe:{ len:5, count:3, rev:0,    hid:0 },
    risk:{ len:6, count:3, rev:0.2,  hid:0.15 } },
  { key:'qa', name:'테스트',
    safe:{ len:5, count:4, rev:0,    hid:0 },
    risk:{ len:7, count:4, rev:0.25, hid:0.2 } }
];
var BOSS = { key:'boss', name:'출시 D-Day', len:6, count:5, rev:0.2, hid:0.15, outageEvery:8, outagePenalty:5 };

// 피버 타임: 맞게 입력할수록 게이지가 차고, 가득 차면 일정 시간 점수 배율 상승
var FEVER = {
  perArrow:0.035,      // 맞게 입력한 화살표 1칸당
  comboBonus:0.002,    // 콤보 1당 추가 (최대 20콤보까지)
  perCmd:0.06,         // 커맨드 하나 완료 시
  mistake:0.3,         // 틀리면 감소
  riskFill:1.25,       // 위험 루트에서는 더 빨리 참
  duration:6,          // 피버 지속 시간(초, 플레이 시간 기준)
  mult:2               // 피버 중 커맨드 점수 배율
};

var ROUTES = {
  safe:{ label:'검증된 방식', mult:1, bonus:0.2, gold:0.1 },
  risk:{ label:'신기술 도입', mult:2, bonus:0.4, gold:0.2 }
};

var CMD_NAMES = [
  ['회의 소집', '요구사항 정리', '와이어프레임', '일정 산정', '기획서 리뷰', '유저 인터뷰'],
  ['git commit', 'npm install', 'git merge --no-ff', 'API 연동', 'DB 마이그레이션', '코드 리뷰 반영'],
  ['npm test', '버그 재현', '회귀 테스트', 'QA 체크리스트', '성능 테스트', '크로스 브라우징'],
  ['deploy --prod', '롤백 준비', '핫픽스', '서버 재시작', '모니터링 확인', '캐시 무효화']
];

var CARDS = [
  { id:'shortcut',     name:'단축키 등록',     tag:'입력', max:1,  desc:'모든 커맨드 길이 −1 (최소 3칸)' },
  { id:'autocomplete', name:'자동 완성',       tag:'입력', max:2,  desc:'커맨드마다 첫 칸 자동 입력 (최대 2장)' },
  { id:'linter',       name:'린터',            tag:'실수', max:2,  desc:'층마다 실수 1회 무시 (장수만큼)' },
  { id:'pair',         name:'페어 프로그래밍', tag:'실수', max:1,  desc:'틀려도 처음이 아니라 틀린 칸부터 다시' },
  { id:'coffee',       name:'커피 한 잔',      tag:'시간', max:99, desc:'즉시 제한 시간 +8초' },
  { id:'refactor',     name:'리팩토링',        tag:'진행', max:99, desc:'다음 층 커맨드 개수 −1' },
  { id:'review',       name:'코드 리뷰',       tag:'변형', max:1,  desc:'버그 화살표(반대 입력)가 나오지 않음' },
  { id:'docs',         name:'문서화',          tag:'변형', max:1,  desc:'미확인 스펙(?) 화살표가 처음부터 보임' },
  { id:'flawless',     name:'무결점 배포',     tag:'점수', max:1,  desc:'층을 실수 없이 끝내면 그 층 점수 ×1.5' },
  { id:'lucky',        name:'행운의 커밋',     tag:'운',   max:1,  desc:'보너스 확률 +15%, 황금 커맨드 등장 ×2' }
];
var CARD_BY_ID = {}; CARDS.forEach(function(c){ CARD_BY_ID[c.id] = c; });

var SPECIALS = [
  { id:'opensource', name:'오픈소스 발견', desc:'다음 층 커맨드 절반이 완료된 상태로 시작' },
  { id:'senior',     name:'시니어 합류',   desc:'다음 카드 보상에서 2장 선택' },
  { id:'server',     name:'서버 증설',     desc:'제한 시간 +20초' },
  { id:'invest',     name:'투자 유치',     desc:'즉시 +1,000점' }
];

// ---------- 기록 저장 ----------
var storageOK = true;
var memRecords = [];
function loadRecords(){
  try {
    var s = localStorage.getItem(STORE_KEY);
    var arr = s ? JSON.parse(s) : [];
    return Array.isArray(arr) ? arr.filter(function(r){ return r && typeof r.name === 'string' && typeof r.score === 'number'; }) : [];
  } catch (e) { storageOK = false; return memRecords.slice(); }
}
function saveRecord(rec){
  var list = loadRecords(); list.push(rec);
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
    var back = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    storageOK = Array.isArray(back) && back.length === list.length;
  } catch (e) { storageOK = false; memRecords = list; }
}
function clearRecords(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} memRecords = []; }
function bestList(){
  var best = {};
  loadRecords().forEach(function(r){
    var b = best[r.name];
    if (!b || r.score > b.score || (r.score === b.score && r.t < b.t)) best[r.name] = r;
  });
  return Object.keys(best).map(function(k){ return best[k]; })
    .sort(function(a, b){ return b.score - a.score || a.t - b.t; });
}
function getLastName(){ try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } }
function setLastName(n){ try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }

// ---------- 상태 ----------
var scene = 'idle', sceneT = 0, T = 0;
var G = null;           // 현재 판
var choice = null;      // 카드·루트 선택 상태
var RL = null;          // 룰렛 상태
var fx = { shake:0, flash:0, flashColor:'#ff3b3b', pops:[], msg:null };
var resetPresses = [];
var DEMO_IDLE_WAIT = 15;    // 대기 화면에서 이 시간(초)이 지나면 데모 플레이 시작
var demoActive = false, D = null;
var demoBadge = document.getElementById('demoBadge');

function has(id){ return G && (G.owned[id] || 0) > 0; }
function cnt(id){ return G ? (G.owned[id] || 0) : 0; }

function newRun(name){
  G = {
    name:name, time:TOTAL_TIME, score:0, layer:0, routeKey:null, routes:[], riskCount:0,
    owned:{}, pity:0, pendingRefactor:0, pendingOpen:false, seniorPicks:0,
    linterLeft:0, mistakes:0, layerMistakes:0, layerPoints:0,
    list:[], idx:0, total:0, pre:0, cmd:null, progress:0,
    isBoss:false, outageT:0, banner:0, clearing:0, paused:false,
    cleared:false, reachedBoss:false, maxStage:0, specials:[], playTime:0, finished:false,
    fever:0, feverT:0, feverCount:0, combo:0, maxCombo:0
  };
}

// ---------- 커맨드 생성 ----------
function makeCmd(L, len, cfg, isBoss){
  var arrows = [];
  for (var j = 0; j < len; j++) {
    var r = rand(), type = 'n';
    if (r < cfg.rev) type = 'rev'; else if (r < cfg.rev + cfg.hid) type = 'hid';
    if (type === 'rev' && has('review')) type = 'n';
    if (type === 'hid' && has('docs')) type = 'n';
    arrows.push({ dir:ri(4), type:type });
  }
  var goldChance = isBoss ? 0 : ROUTES[G.routeKey].gold * (has('lucky') ? 2 : 1);
  return { name:pick(CMD_NAMES[L]), arrows:arrows, golden: rand() < goldChance, miss:0 };
}
function autoStart(c){ return Math.min(cnt('autocomplete'), c.arrows.length - 1); }

function startLayer(L){
  var isBoss = L === 3;
  var cfg = isBoss ? BOSS : LAYERS[L][G.routeKey];
  var count = Math.max(1, cfg.count - G.pendingRefactor);
  G.pendingRefactor = 0;
  var pre = 0;
  if (G.pendingOpen) { pre = Math.floor(count / 2); G.pendingOpen = false; }
  var len = Math.max(3, cfg.len - (has('shortcut') ? 1 : 0));
  G.layer = L; G.isBoss = isBoss; G.list = [];
  for (var i = 0; i < count - pre; i++) G.list.push(makeCmd(L, len, cfg, isBoss));
  G.total = count; G.pre = pre; G.idx = 0;
  G.cmd = G.list[0]; G.progress = autoStart(G.cmd);
  G.layerMistakes = 0; G.layerPoints = 0; G.linterLeft = cnt('linter');
  G.outageT = 0; G.banner = 1.1; G.clearing = 0;
  G.maxStage = Math.max(G.maxStage, L + 1);
  if (isBoss) G.reachedBoss = true;
  go('play');
}

// ---------- 입력 판정 ----------
function onDir(d){
  if (scene !== 'play' || !G || G.paused || G.banner > 0 || G.clearing > 0 || G.finished) return;
  var c = G.cmd, a = c.arrows[G.progress];
  var expect = a.type === 'rev' ? OPP[a.dir] : a.dir;
  if (d === expect) {
    G.progress++;
    G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    addFever(FEVER.perArrow + Math.min(G.combo, 20) * FEVER.comboBonus);
    if (G.progress >= c.arrows.length) completeCmd();
  } else {
    wrongInput();
  }
}
function inFever(){ return G && G.feverT > 0; }
function addFever(v){
  if (inFever()) return;
  if (!G.isBoss && G.routeKey === 'risk') v *= FEVER.riskFill;
  G.fever = Math.min(1, G.fever + v);
  if (G.fever >= 1) {
    G.feverT = FEVER.duration; G.feverCount++;
    showMsg('FEVER TIME! 점수 ×' + FEVER.mult + ' · 실수해도 리셋 없음', '#ff4fd8', 1.4);
    fx.flash = 0.8; fx.flashColor = '#ff4fd8';
  }
}
function wrongInput(){
  if (inFever()) { fx.shake = 0.12; return; }   // 피버 중에는 실수해도 진행이 유지됨
  if (G.linterLeft > 0) { G.linterLeft--; showMsg('린터가 실수를 막았다!', '#ffd84a', 0.9); return; }
  G.combo = 0;
  G.fever = Math.max(0, G.fever - FEVER.mistake);
  G.mistakes++; G.layerMistakes++; G.cmd.miss++;
  if (G.cmd.golden) { G.cmd.golden = false; showMsg('황금 커맨드 실패…', '#c99a1e', 0.9); }
  fx.shake = 0.25; fx.flash = 0.6; fx.flashColor = '#ff3b3b';
  if (!has('pair')) G.progress = autoStart(G.cmd);
}
function completeCmd(){
  var c = G.cmd;
  var mult = G.isBoss ? 1 : ROUTES[G.routeKey].mult;
  var fev = inFever();
  var pts = c.arrows.length * 10 * mult * (fev ? FEVER.mult : 1);
  G.score += pts; G.layerPoints += pts;
  fx.pops.push({ x:160, y:112, text:'+' + pts + (fev ? ' FEVER' : ''), color:fev ? '#ff4fd8' : '#7be3a0', t:0.9 });
  addFever(FEVER.perCmd);
  if (c.golden && c.miss === 0) {
    var sp = pick(SPECIALS);
    applySpecial(sp);
    showMsg('★ 황금 커맨드! ' + sp.name, '#ffd84a', 1.6);
    fx.flash = 0.7; fx.flashColor = '#ffd84a';
  }
  G.idx++;
  if (G.idx >= G.list.length) { layerClear(); return; }
  G.cmd = G.list[G.idx]; G.progress = autoStart(G.cmd);
}
function layerClear(){
  if (G.isBoss) {
    var bonus = 2000 + Math.ceil(G.time) * 20;
    G.score += bonus; G.cleared = true;
    G.clearText = '출시 성공! +' + fmt(bonus);
    G.clearing = 1.6;
    fx.flash = 0.8; fx.flashColor = '#7be3a0';
    return;
  }
  var mult = ROUTES[G.routeKey].mult;
  var add = 300 * mult;
  G.score += add; G.layerPoints += add;
  var txt = (G.layer + 1) + '층 · ' + LAYERS[G.layer].name + ' 완료! +' + fmt(add);
  if (has('flawless') && G.layerMistakes === 0) {
    var extra = Math.round(G.layerPoints * 0.5);
    G.score += extra; txt += '  무결점 +' + fmt(extra);
  }
  G.clearText = txt; G.clearing = 1.2;
  fx.flash = 0.5; fx.flashColor = '#7be3a0';
}
function afterClear(){
  if (G.isBoss) { finish(true); return; }
  openPick('reward');
}

// ---------- 카드·특수 보상 ----------
function applyCard(id){
  G.owned[id] = (G.owned[id] || 0) + 1;
  if (id === 'coffee') G.time += 8;
  if (id === 'refactor') G.pendingRefactor++;
}
function applySpecial(sp){
  G.specials.push(sp.id);
  if (sp.id === 'opensource') G.pendingOpen = true;
  if (sp.id === 'senior') G.seniorPicks = 1;
  if (sp.id === 'server') G.time += 20;
  if (sp.id === 'invest') G.score += 1000;
}
function drawOffers(){
  var pool = CARDS.filter(function(c){ return cnt(c.id) < c.max; });
  return shuffle(pool).slice(0, 3);
}
function openPick(ctxName){
  var picks = 1;
  if (ctxName === 'reward' && G.seniorPicks > 0) { picks = 2; G.seniorPicks = 0; }
  choice = { kind:'pick', ctx:ctxName, offers:drawOffers(), left:picks, total:picks, sel:0, t:CHOICE_TIME };
  go('pick');
}
function choosePick(i){
  if (scene !== 'pick' || !choice || !choice.offers[i]) return;
  var c = choice.offers[i];
  applyCard(c.id);
  choice.offers.splice(i, 1);
  choice.left--;
  if (choice.left > 0 && choice.offers.length) { choice.sel = 0; choice.t = CHOICE_TIME; renderUI(); return; }
  if (choice.ctx === 'start') openRoute(0); else openRoulette();
}

// ---------- 루트 선택 ----------
function openRoute(L){
  G.layer = L;
  choice = { kind:'route', L:L, sel:0, t:CHOICE_TIME };
  go('route');
}
function chooseRoute(key){
  if (scene !== 'route') return;
  G.routeKey = key; G.routes.push(key === 'safe' ? 'S' : 'R');
  if (key === 'risk') G.riskCount++;
  startLayer(choice.L);
}

// ---------- 룰렛 ----------
function bonusChance(){
  var base = ROUTES[G.routeKey].bonus;
  return Math.min(0.9, base + G.pity + (has('lucky') ? 0.15 : 0));
}
function openRoulette(){
  var chance = bonusChance();
  var win = rand() < chance;
  var sp = pick(SPECIALS);
  RL = { chance:chance, win:win, sp:sp, t:0, revealed:false, revealAt:0, face:0 };
  go('roulette');
}
function revealRoulette(){
  RL.revealed = true; RL.revealAt = RL.t;
  if (RL.win) { applySpecial(RL.sp); G.pity = 0; fx.flash = 0.7; fx.flashColor = '#ffd84a'; }
  else { G.pity = Math.min(0.6, G.pity + 0.15); }
  renderUI();
}
function nextAfterRoulette(){
  if (scene !== 'roulette') return;
  var next = G.layer + 1;
  if (next <= 2) openRoute(next); else { G.routeKey = G.routeKey || 'safe'; startLayer(3); }
}

// ---------- 종료 ----------
function finish(cleared){
  if (G.finished) return;
  G.finished = true;
  if (G.time < 0) G.time = 0;
  var rec = {
    name:G.name, score:Math.round(G.score), cleared:!!cleared, stage:G.maxStage,
    routes:G.routes.join(''), mistakes:G.mistakes, left:Math.ceil(G.time),
    date:new Date().toISOString().slice(0, 10), t:Date.now()
  };
  if (!G.demo) saveRecord(rec);   // 데모 플레이 기록은 랭킹에 남기지 않음
  G.record = rec;
  go('result');
}
function honor(){
  if (G.cleared && G.riskCount >= 3) return ['유니콘 스타트업 CTO', G.name + ' 팀, 신기술로 출시 성공!'];
  if (G.cleared) return ['출시 장인', G.name + ' 팀, 서비스 출시 성공!'];
  if (G.reachedBoss) return ['배포 직전의 개발자', '아깝다! 출시 D-Day에서 멈췄습니다'];
  if (G.maxStage >= 3) return ['QA 통과 대기 중', '테스트까지 왔습니다. 조금만 더!'];
  return ['열정 넘치는 인턴', '첫 커밋 완료! 다시 도전해 보세요'];
}

// ---------- 화면 전환 ----------
function go(s){ scene = s; sceneT = 0; renderUI(); }

function rankTable(highlight){
  var list = bestList().slice(0, 10);
  if (!list.length) return '<div class="empty">아직 기록이 없습니다. 첫 번째 출시자가 되어 보세요!</div>';

    var cls = (i === 0 ? 'top1' : '') + (highlight && r.name === highlight ? ' me' : '');

function ownedSummary(){
  var ks = Object.keys(G.owned);
  if (!ks.length) return '없음';
  return ks.map(function(k){ return CARD_BY_ID[k].name + (G.owned[k] > 1 ? '×' + G.owned[k] : ''); }).join(', ');
}

function submitName(){
  var inp = document.getElementById('nick'); if (!inp) return;
  var v = inp.value.replace(/[\u0000-\u001f<>&"'`\\]/g, '').trim().slice(0, 10);
  if (!v) { document.getElementById('nickErr').textContent = '닉네임을 입력해 주세요'; return; }
  setLastName(v);
  newRun(v);
  openPick('start');
}

// ---------- 입력 ----------
document.addEventListener('keydown', function(e){
  if (demoActive) {
    if (['Shift','Control','Alt','Meta'].indexOf(e.key) >= 0) return;
    e.preventDefault(); if (!e.repeat) stopDemo(true);
    return;
  }
  var tgt = e.target;
  if (tgt && tgt.tagName === 'INPUT') {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submitName(); }
    else if (e.key === 'Escape') { go('idle'); }
    return;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  handleKey(e.code);
});
function digit(code){ var m = /^(Digit|Numpad)([1-9])$/.exec(code); return m ? parseInt(m[2], 10) : 0; }
function handleKey(code){
  var isEnter = code === 'Enter' || code === 'NumpadEnter' || code === 'Space';
  if (scene === 'idle') {
    if (code === 'KeyR') {
      var now = performance.now();
      resetPresses = resetPresses.filter(function(t){ return now - t < 3000; }); resetPresses.push(now);
      if (resetPresses.length >= 5) {
        resetPresses = [];
        if (window.confirm('모든 랭킹 기록을 삭제할까요? 되돌릴 수 없습니다.')) { clearRecords(); renderUI(); }
      }
      return;
    }
    if (isEnter) go('nickname');
  } else if (scene === 'pick') {
    var d = digit(code);
    if (d) { choosePick(d - 1); return; }
    if (code === 'ArrowLeft' || code === 'KeyA') { choice.sel = (choice.sel + choice.offers.length - 1) % choice.offers.length; renderUI(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { choice.sel = (choice.sel + 1) % choice.offers.length; renderUI(); }
    else if (isEnter) choosePick(choice.sel);
  } else if (scene === 'route') {
    var d2 = digit(code);
    if (d2 === 1) { chooseRoute('safe'); return; }
    if (d2 === 2) { chooseRoute('risk'); return; }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS','KeyA','KeyD'].indexOf(code) >= 0) { choice.sel = 1 - choice.sel; renderUI(); }
    else if (isEnter) chooseRoute(choice.sel === 0 ? 'safe' : 'risk');
  } else if (scene === 'roulette') {
    if (isEnter && RL.revealed) nextAfterRoulette();
  } else if (scene === 'play') {
    if (G.paused) { G.paused = false; renderUI(); return; }
    if (code === 'Escape') { G.paused = true; renderUI(); return; }
    if (KEYMAP.hasOwnProperty(code)) onDir(KEYMAP[code]);
  } else if (scene === 'result') {
    if (code === 'Enter' || code === 'NumpadEnter') { newRun(G.name); openPick('start'); }
    else if (code === 'Escape') go('idle');
  }
}
stage.addEventListener('click', function(e){
  if (demoActive) { e.stopPropagation(); e.preventDefault(); stopDemo(true); }
}, true);
ui.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'start' && scene === 'idle') go('nickname');
  else if (act === 'nickOk') submitName();
  else if (act === 'toIdle') go('idle');
  else if (act === 'pick') choosePick(parseInt(el.getAttribute('data-i'), 10));
  else if (act === 'route') chooseRoute(el.getAttribute('data-k'));
});
stage.addEventListener('click', function(){
  if (scene === 'play' && G && G.paused) { G.paused = false; renderUI(); }
  else if (scene === 'roulette' && RL && RL.revealed) nextAfterRoulette();
});
function autoPause(){ if (demoActive) return; if (scene === 'play' && G && !G.paused && !G.finished) { G.paused = true; renderUI(); } }
document.addEventListener('visibilitychange', function(){ if (document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);

function showMsg(text, color, t){ fx.msg = { text:text, color:color, t:t }; }

// ---------- 데모 플레이 (오락실 어트랙트 모드) ----------
// 실제 게임 로직을 그대로 쓰고 입력만 자동으로 넣는다. 기록은 저장하지 않는다.
function startDemo(){
  demoActive = true;
  D = { name:'DEMO', typed:0, wait:0.9, phase:null, resultSeen:false };
  demoBadge.style.display = 'block';
  G = null; choice = null; RL = null;
  go('nickname');
}
function endDemo(){
  demoActive = false; D = null; demoBadge.style.display = 'none';
  G = null; choice = null; RL = null; fx.msg = null; fx.pops = [];
}
function stopDemo(toStart){ endDemo(); go(toStart ? 'nickname' : 'idle'); }
function demoTick(dt){
  D.wait -= dt;
  if (D.wait > 0) return;
  if (scene === 'nickname') {
    var inp = document.getElementById('nick');
    if (D.typed < D.name.length) { D.typed++; if (inp) inp.value = D.name.slice(0, D.typed); D.wait = 0.2; }
    else { newRun(D.name); G.demo = true; openPick('start'); D.wait = 1.0; }
  } else if (scene === 'pick') {
    if (D.phase !== 'pickSel') { choice.sel = ri(choice.offers.length); renderUI(); D.phase = 'pickSel'; D.wait = 1.0; }
    else { D.phase = null; choosePick(choice.sel); D.wait = 1.0; }
  } else if (scene === 'route') {
    if (D.phase !== 'routeSel') { choice.sel = rand() < 0.5 ? 0 : 1; renderUI(); D.phase = 'routeSel'; D.wait = 1.1; }
    else { D.phase = null; chooseRoute(choice.sel === 0 ? 'safe' : 'risk'); D.wait = 0.3; }
  } else if (scene === 'play') {
    if (!G || G.banner > 0 || G.clearing > 0 || G.finished) { D.wait = 0.1; return; }
    var a = G.cmd.arrows[G.progress];
    var expect = a.type === 'rev' ? OPP[a.dir] : a.dir;
    if (rand() < 0.07) { onDir((expect + 1 + ri(3)) % 4); D.wait = 0.55; return; }   // 가끔 틀리는 모습도 보여 줌
    onDir(expect);
    D.wait = 0.22 + rand() * 0.2 + (a.type === 'rev' ? 0.3 : 0) + (a.type === 'hid' ? 0.25 : 0);
  } else if (scene === 'roulette') {
    if (!RL.revealed) { D.wait = 0.2; return; }
    if (D.phase !== 'rlSeen') { D.phase = 'rlSeen'; D.wait = 1.6; return; }
    D.phase = null; nextAfterRoulette(); D.wait = 0.8;
  } else if (scene === 'result') {
    if (!D.resultSeen) { D.resultSeen = true; D.wait = 7; return; }
    stopDemo(false);
  }
}

// ---------- 업데이트 ----------
function update(dt){
  T += dt; sceneT += dt;
  if (fx.shake > 0) fx.shake = Math.max(0, fx.shake - dt);
  if (fx.flash > 0) fx.flash = Math.max(0, fx.flash - dt * 2.5);
  if (fx.msg) { fx.msg.t -= dt; if (fx.msg.t <= 0) fx.msg = null; }
  fx.pops = fx.pops.filter(function(p){ p.t -= dt; p.y -= dt * 25; return p.t > 0; });
  if (demoActive && D) demoTick(dt);
  else if (scene === 'idle' && sceneT > DEMO_IDLE_WAIT) startDemo();

  if (scene === 'play' && G && !G.finished) {
    if (G.paused) return;
    if (G.banner > 0) { G.banner -= dt; return; }
    if (G.clearing > 0) { G.clearing -= dt; if (G.clearing <= 0) afterClear(); return; }
    G.time -= dt; G.playTime += dt;
    if (G.feverT > 0) { G.feverT -= dt; if (G.feverT <= 0) { G.feverT = 0; G.fever = 0; } }
    if (G.isBoss) {
      G.outageT += dt;
      if (G.outageT >= BOSS.outageEvery) {
        G.outageT -= BOSS.outageEvery;
        G.time -= BOSS.outagePenalty;
        fx.flash = 0.8; fx.flashColor = '#ff3b3b'; fx.shake = 0.35;
        showMsg('장애 발생! 제한 시간 −' + BOSS.outagePenalty + '초', '#ff5a5a', 1.2);
      }
    }
    if (G.time <= 0) { G.time = 0; finish(false); }
  } else if ((scene === 'pick' || scene === 'route') && choice) {
    var before = Math.ceil(choice.t);
    choice.t -= dt;
    if (Math.ceil(choice.t) !== before) { var cd = document.getElementById('cd'); if (cd) cd.textContent = Math.max(0, Math.ceil(choice.t)); }
    if (choice.t <= 0) {
      if (scene === 'pick') choosePick(0); else chooseRoute('safe');
    }
  } else if (scene === 'roulette' && RL) {
    RL.t += dt;
    if (!RL.revealed) {
      var f = Math.floor(RL.t * 14) % SPECIALS.length;
      if (f !== RL.face) { RL.face = f; var sp = document.getElementById('spin'); if (sp) sp.textContent = (f % 2 ? '꽝' : SPECIALS[f].name); }
      if (RL.t >= 1.4) revealRoulette();
    } else if (RL.t - RL.revealAt >= 3) {
      nextAfterRoulette();
    }
  } else if (scene === 'result') {
    if (sceneT > 60) go('idle');
  }
}

// ---------- 그리기 ----------
function R(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || 'bold') + ' ' + size + 'px "Malgun Gothic","맑은 고딕",sans-serif';
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function hash(n){ var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

function drawPerson(x, y, shirt){
  R(x + 2, y, 8, 3, '#3b2b20'); R(x + 2, y + 3, 8, 5, '#3b2b20');
  R(x + 1, y + 8, 10, 10, shirt); R(x, y + 10, 2, 6, shirt); R(x + 10, y + 10, 2, 6, shirt);
}
function drawBg(key){
  if (key === 'idle') {
    R(0, 0, W, H, '#0d1230'); R(0, 0, W, 60, '#101640');
    for (var i = 0; i < 40; i++) R(Math.floor(hash(i) * W), Math.floor(hash(i + 50) * 90), 1, 1, '#4a5390');
    R(265, 16, 8, 2, '#e8e2b8'); R(263, 18, 12, 2, '#e8e2b8'); R(262, 20, 14, 6, '#e8e2b8'); R(263, 26, 12, 2, '#e8e2b8'); R(265, 28, 8, 2, '#e8e2b8');
    R(267, 21, 3, 3, '#cfc89a'); R(271, 25, 2, 2, '#cfc89a');
    var bx = [10, 52, 96, 150, 196, 240, 284], bw = [36, 40, 46, 40, 38, 38, 32], bh = [80, 110, 70, 125, 90, 105, 75];
    for (var b = 0; b < bx.length; b++) {
      var top = H - bh[b];
      R(bx[b], top, bw[b], bh[b], b === 3 ? '#232c66' : '#1a2152');
      for (var wy = top + 6; wy < H - 6; wy += 9) for (var wx = bx[b] + 4; wx < bx[b] + bw[b] - 5; wx += 8) {
        var on = hash(wx * 3 + wy * 7 + b) > 0.55;
        R(wx, wy, 4, 4, on ? (b === 3 ? '#ffd84a' : '#c9b46a') : '#121838');
      }
    }
    R(156, H - 125 - 8, 28, 8, '#3ef2ff');
    return;
  }
  if (key === 'boss') {
    R(0, 0, W, H, '#140d1c'); R(0, 120, W, 60, '#1c1226');
    var alert = 0.5 + 0.5 * Math.sin(T * 6);
    ctx.globalAlpha = 0.15 + alert * 0.2; R(0, 0, W, H, '#ff2a2a'); ctx.globalAlpha = 1;
    R(150, 20, 20, 6, '#3a1a1a'); R(153, 22, 14, 6, alert > 0.5 ? '#ff4a4a' : '#7a2020');
    for (var k = 0; k < 6; k++) {
      var x = 16 + k * 50; R(x, 32, 36, 88, '#262036'); R(x + 2, 34, 32, 84, '#1a1526');
      for (var s = 0; s < 8; s++) {
        R(x + 4, 38 + s * 10, 28, 7, '#2e2840');
        var blink = hash(k * 13 + s + Math.floor(T * 4)) > 0.4;
        R(x + 6, 40 + s * 10, 2, 2, blink ? '#7be3a0' : '#2a5a3a');
        R(x + 10, 40 + s * 10, 2, 2, hash(k + s * 7 + Math.floor(T * 3)) > 0.75 ? '#ff4a4a' : '#5a2a2a');
      }
    }
    return;
  }
  // 사무실 공통
  var wall = { plan:'#2b3157', dev:'#1f2748', qa:'#2a2f46' }[key] || '#222';
  R(0, 0, W, H, wall); R(0, 118, W, 62, '#2a2038'); R(0, 116, W, 2, '#3a2d4e');
  for (var p = 0; p < W; p += 32) R(p, 118, 1, 62, '#251c33');
  if (key === 'plan') {
    R(70, 22, 180, 74, '#6b7280'); R(73, 25, 174, 68, '#dfe6f0');
    R(82, 34, 60, 3, '#2b6f8f'); R(82, 42, 90, 3, '#d2552d'); R(82, 50, 40, 3, '#2b6f8f');
    R(150, 34, 30, 22, '#9aa8c0'); R(152, 36, 26, 18, '#dfe6f0'); R(155, 40, 20, 2, '#5a6478'); R(155, 45, 14, 2, '#5a6478');
    R(190, 32, 14, 14, '#ffd84a'); R(208, 32, 14, 14, '#ff9ad8'); R(226, 32, 14, 14, '#7be3a0');
    R(190, 50, 14, 14, '#7be3a0'); R(208, 50, 14, 14, '#ffd84a');
    R(82, 66, 120, 3, '#5a6478'); R(82, 74, 80, 3, '#5a6478');
    R(60, 104, 200, 8, '#6b4f3a'); R(66, 112, 6, 10, '#4a3626'); R(248, 112, 6, 10, '#4a3626');
    drawPerson(96, 88, '#4a90c2'); drawPerson(206, 88, '#d2552d');
  } else if (key === 'dev') {
    R(22, 24, 44, 36, '#2d3561'); R(24, 26, 40, 32, '#3ef2ff'); ctx.globalAlpha = 0.25; R(24, 26, 40, 32, '#0b0f1e'); ctx.globalAlpha = 1;
    var mons = [[92, 52], [132, 46], [184, 52]];
    for (var m = 0; m < 3; m++) {
      var mx = mons[m][0], my = mons[m][1];
      R(mx, my, 44, 32, '#2d3561'); R(mx + 2, my + 2, 40, 26, '#0e1226');
      for (var l = 0; l < 5; l++) R(mx + 5 + (l % 2) * 4, my + 5 + l * 4, 10 + Math.floor(hash(m * 9 + l) * 22), 2, ['#7be3a0', '#3ef2ff', '#ff8ad8', '#ffd84a', '#9aa2c7'][l]);
      R(mx + 19, my + 32, 6, 6, '#2d3561');
    }
    R(70, 104, 180, 8, '#6b4f3a'); R(76, 112, 6, 10, '#4a3626'); R(238, 112, 6, 10, '#4a3626');
    drawPerson(150, 92, '#4a90c2');
    R(264, 88, 12, 16, '#8a5a3a'); R(260, 74, 20, 14, '#3a8a4a'); R(264, 68, 12, 8, '#4aa85a');
  } else if (key === 'qa') {
    R(40, 20, 240, 80, '#8a6a4a'); R(43, 23, 234, 74, '#b8916a');
    var notes = ['#ffd84a', '#ff9ad8', '#7be3a0', '#ffd84a', '#9ad8ff', '#ff9ad8', '#ffd84a', '#7be3a0', '#9ad8ff', '#ffd84a'];
    for (var n = 0; n < notes.length; n++) {
      var nx = 52 + (n % 5) * 44, ny = 30 + Math.floor(n / 5) * 32;
      R(nx, ny, 26, 24, notes[n]); R(nx + 4, ny + 6, 16, 2, '#5a4a3a'); R(nx + 4, ny + 11, 12, 2, '#5a4a3a');
      if (n % 3 === 0) { R(nx + 16, ny + 14, 6, 6, '#d33a3a'); R(nx + 15, ny + 16, 8, 2, '#d33a3a'); }
    }
    R(70, 104, 180, 8, '#6b4f3a'); R(76, 112, 6, 10, '#4a3626'); R(238, 112, 6, 10, '#4a3626');
    R(140, 90, 40, 14, '#3a4378'); R(142, 92, 36, 10, '#1a2152');
    drawPerson(110, 90, '#7a5cc2');
  }
}

var ARROW_BMP = ['....#....', '...###...', '..#####..', '.#######.', '#########', '...###...', '...###...', '...###...', '...###...'];
var AN = ARROW_BMP.length;
function drawArrow(x, y, dir, color, cell){
  ctx.fillStyle = color;
  for (var r = 0; r < AN; r++) for (var c = 0; c < AN; c++) {
    if (ARROW_BMP[r][c] !== '#') continue;
    var px, py;
    if (dir === 0) { px = c; py = r; } else if (dir === 1) { px = AN - 1 - r; py = c; }
    else if (dir === 2) { px = c; py = AN - 1 - r; } else { px = r; py = c; }
    ctx.fillRect(x + px * cell, y + py * cell, cell, cell);
  }
}
function boxBorder(x, y, w, h, c, dashed){
  if (!dashed) { R(x, y, w, 1, c); R(x, y + h - 1, w, 1, c); R(x, y, 1, h, c); R(x + w - 1, y, 1, h, c); return; }
  for (var i = 0; i < w; i += 3) { R(x + i, y, 2, 1, c); R(x + i, y + h - 1, 2, 1, c); }
  for (var j = 0; j < h; j += 3) { R(x, y + j, 1, 2, c); R(x + w - 1, y + j, 1, 2, c); }
}

function drawPlay(){
  if (inFever()) {   // 피버 중 배경 깜빡임
    ctx.globalAlpha = 0.12 + 0.08 * Math.sin(T * 12); R(0, 0, W, H, '#ff4fd8'); ctx.globalAlpha = 1;
  }
  var mm =Math.floor(Math.max(0, G.time) / 60), ss = Math.floor(Math.max(0, G.time) % 60);
  // HUD
  ctx.globalAlpha = 0.6; R(0, 0, W, 16, '#000'); ctx.globalAlpha = 1;
  var stageLabel = G.isBoss ? '보스 · ' + BOSS.name : (G.layer + 1) + '층 · ' + LAYERS[G.layer].name + ' · ' + ROUTES[G.routeKey].label;
  txt(stageLabel, 5, 8, 6.5, G.isBoss ? '#ff8a8a' : (G.routeKey === 'risk' ? '#ff8a5c' : '#5ccfae'));
  txt((mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss, 160, 8.5, 10, G.time < 15 ? '#ff5a5a' : '#ffd84a', 'center');
  txt('SCORE ' + fmt(G.score), W - 5, 8, 6.5, '#e8ebff', 'right');
  R(0, 16, W, 2, '#11152a'); R(0, 16, Math.round(W * Math.min(1, Math.max(0, G.time) / TOTAL_TIME)), 2, G.time < 15 ? '#ff5a5a' : '#ffd84a');

  if (G.isBoss) {
    var remain = G.list.length - G.idx;
    txt('출시 진행률', 100, 26, 6, '#ff8a8a', 'right');
    for (var h = 0; h < G.total; h++) {
      var done = h < (G.total - remain);
      R(104 + h * 24, 22, 22, 8, done ? '#7be3a0' : '#3a1a24'); boxBorder(104 + h * 24, 22, 22, 8, '#ff8a8a');
    }
  }

  // 커맨드 패널
  var c = G.cmd;
  var n = c.arrows.length, bw = 22, gap = 3, totalW = n * bw + (n - 1) * gap;
  var px = Math.min(70, 160 - totalW / 2 - 8), pw = W - px * 2;
  ctx.globalAlpha = 0.92; R(px, 124, pw, 52, '#0b0f1e'); ctx.globalAlpha = 1;
  R(px, 124, pw, 1, c.golden ? '#ffd84a' : '#3ef2ff');
  var done2 = G.pre + G.idx;
  txt(c.name + '   ' + (done2 + 1) + '/' + G.total, 160, 133, 6.5, c.golden ? '#ffd84a' : '#9aa2c7', 'center');
  if (c.golden) txt('★ 황금 커맨드', px + 4, 133, 5.5, '#ffd84a');
  if (G.combo >= 5) txt(G.combo + ' 콤보', px + pw - 4, 133, 5.5, G.combo >= 20 ? '#ff8ad8' : '#9ad8ff', 'right');
  // 피버 게이지
  var fev = inFever(), gy = 114, gh = 8;
  R(px, gy, pw, gh, '#11152a'); boxBorder(px, gy, pw, gh, fev ? '#ffd84a' : '#3a4378');
  var ratio = fev ? G.feverT / FEVER.duration : G.fever;
  var fc = fev ? (Math.floor(T * 8) % 2 ? '#ff4fd8' : '#c22fae') : (G.fever >= 0.8 ? '#ff8ad8' : '#b0489a');
  R(px + 1, gy + 1, Math.round((pw - 2) * ratio), gh - 2, fc);
  txt(fev ? 'FEVER TIME ×' + FEVER.mult : 'FEVER', px + 4, gy + gh / 2 + 0.3, 5, '#ffffff');
  txt(fev ? G.feverT.toFixed(1) + '초' : Math.floor(G.fever * 100) + '%', px + pw - 4, gy + gh / 2 + 0.3, 5, '#ffffff', 'right');
  var ax = Math.round(160 - totalW / 2), ay = 145;
  var bob = Math.round(Math.sin(T * 10) * 0.6);
  for (var i = 0; i < n; i++) {
    var a = c.arrows[i], bx = ax + i * (bw + gap), by = ay;
    var isDone = i < G.progress, isCur = i === G.progress;
    if (isCur) by += bob;
    if (isDone) {
      R(bx, by, bw, bw, '#2b8a6e');
      drawArrow(bx + 2, by + 2, a.type === 'rev' ? OPP[a.dir] : a.dir, '#ffffff', 2);
      continue;
    }
    R(bx, by, bw, bw, '#1b2140');
    var bc = a.type === 'rev' ? '#ff5a5a' : (a.type === 'hid' ? '#9aa2c7' : (c.golden ? '#ffd84a' : '#e8ebff'));
    boxBorder(bx, by, bw, bw, bc, a.type === 'hid');
    if (isCur) boxBorder(bx - 1, by - 1, bw + 2, bw + 2, '#ffffff');
    if (a.type === 'hid' && !isCur) txt('?', bx + bw / 2, by + bw / 2 + 0.5, 10, '#9aa2c7', 'center');
    else drawArrow(bx + 2, by + 2, a.dir, a.type === 'rev' ? '#ff5a5a' : (c.golden ? '#ffd84a' : '#e8ebff'), 2);
  }
  var hasRev = c.arrows.some(function(a, i){ return a.type === 'rev' && i >= G.progress; });
  var hasHid = c.arrows.some(function(a, i){ return a.type === 'hid' && i > G.progress; });
  if (hasRev || hasHid) txt((hasRev ? '빨간 화살표는 반대 방향으로!' : '') + (hasRev && hasHid ? '   ' : '') + (hasHid ? '? 는 차례가 되면 공개' : ''), 160, 172, 5, '#ff8a8a', 'center');
  // 보유 카드
  var keys =Object.keys(G.owned).filter(function(k){ return k !== 'coffee' && k !== 'refactor'; });
  for (var k = 0; k < Math.min(keys.length, 5); k++) {
    R(3, 126 + k * 10, px - 6, 9, '#2d3561');
    var label = CARD_BY_ID[keys[k]].name + (G.owned[keys[k]] > 1 ? '×' + G.owned[keys[k]] : '');
    if (keys[k] === 'linter') label = '린터 ' + G.linterLeft + '/' + G.owned.linter;
    txt(label, 5, 131, 5, '#e8ebff');
    ctx.translate(0, 0);
  }
  if (keys.length > 5) txt('+' + (keys.length - 5), 5, 178, 5, '#9aa2c7');
  // 보너스 확률
  if (!G.isBoss) {
    R(W - px + 3, 126, px - 6, 9, '#5a4a1a');
    txt('보너스 ' + Math.round(bonusChance() * 100) + '%', W - px + 5, 131, 5, '#ffd84a');
  }
  // 팝업·메시지
  fx.pops.forEach(function(p){ ctx.globalAlpha = Math.min(1, p.t * 2); txt(p.text, p.x, p.y, 8, p.color, 'center'); });
  ctx.globalAlpha = 1;
  if (fx.msg) {
    ctx.globalAlpha = 0.85; R(0, 48, W, 18, '#000'); ctx.globalAlpha = 1;
    txt(fx.msg.text, 160, 57, 8, fx.msg.color, 'center');
  }
  if (G.banner > 0) {
    ctx.globalAlpha = 0.85; R(0, 56, W, 50, '#000'); ctx.globalAlpha = 1;
    var big = G.isBoss ? '보스 · ' + BOSS.name : (G.layer + 1) + '층 · ' + LAYERS[G.layer].name;
    txt(big, 160, 74, 14, G.isBoss ? '#ff5a5a' : '#ffffff', 'center');
    txt(G.isBoss ? '8초마다 장애 발생! 커맨드 ' + (G.total - G.pre) + '개를 끝내 출시하세요' : ROUTES[G.routeKey].label + ' · 커맨드 ' + (G.total - G.pre) + '개 · 준비!', 160, 94, 7, '#9aa2c7', 'center');
  }
  if (G.clearing > 0) {
    ctx.globalAlpha = 0.85; R(0, 60, W, 34, '#000'); ctx.globalAlpha = 1;
    txt(G.clearText, 160, 77, 10, '#7be3a0', 'center');
  }
}

function draw(){
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (fx.shake > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * 3), Math.round((Math.random() * 2 - 1) * 2));
  var bgKey = 'idle';
  if (G && (scene === 'play' || scene === 'route' || scene === 'pick' || scene === 'roulette')) {
    bgKey = scene === 'pick' && choice && choice.ctx === 'start' ? 'plan' : (G.layer === 3 ? 'boss' : LAYERS[G.layer].key);
  }
  drawBg(bgKey);
  if (scene !== 'play' && scene !== 'idle') { ctx.globalAlpha = 0.55; R(0, 0, W, H, '#05060c'); ctx.globalAlpha = 1; }
  if (scene === 'idle') { ctx.globalAlpha = 0.35; R(0, 0, W, H, '#05060c'); ctx.globalAlpha = 0.35; R(0, 0, 175, H, '#05060c'); ctx.globalAlpha = 1; }
  if (scene === 'play' && G) drawPlay();
  ctx.restore();
  if (fx.flash > 0) { ctx.globalAlpha = Math.min(0.5, fx.flash * 0.5); R(0, 0, W, H, fx.flashColor); ctx.globalAlpha = 1; }
}

// ---------- 루프 ----------
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
renderUI();
if (/[?&]demo\b/.test(location.search)) startDemo();   // 주소 끝에 ?demo 를 붙이면 바로 데모 재생

// 점검용 훅 (게임 동작에는 영향 없음)
window.__RR = {
  get scene(){ return scene; }, get G(){ return G; }, get choice(){ return choice; }, get RL(){ return RL; },
  step:function(sec){ var n = Math.round(sec * 60); for (var i = 0; i < n; i++) update(1 / 60); draw(); },
  key:function(code){ document.dispatchEvent(new KeyboardEvent('keydown', { code:code, key:code, bubbles:true })); },
  expected:function(){ var a = G.cmd.arrows[G.progress]; return a.type === 'rev' ? OPP[a.dir] : a.dir; },
  records:loadRecords, best:bestList, get storageOK(){ return storageOK; },
  get demo(){ return demoActive; }, startDemo:startDemo
};
})();
</script>
